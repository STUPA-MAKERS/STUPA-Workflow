[project]
name = "antragsplattform-mcp"
version = "0.4.6"
description = "MCP server exposing the antragsplattform API to agents via browser-grant OAuth."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 1.3 added `FastMCP(instructions=)`; below that the kwarg is silently dropped.
    # 2.0 renamed `mcp.server.fastmcp.FastMCP` to `mcp.server.mcpserver.MCPServer`.
    "mcp>=1.3,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
antragsplattform-mcp = "antragsplattform_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["antragsplattform_mcp"]
