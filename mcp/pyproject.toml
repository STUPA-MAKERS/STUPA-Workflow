[project]
name = "antragsplattform-mcp"
version = "0.4.6"
description = "MCP server exposing the antragsplattform API to agents via browser-grant OAuth."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Cap below 2.0: that release moved `mcp.server.fastmcp` into the separate
    # `fastmcp` distribution, so an uncapped install resolves to a version this
    # server cannot import. Dependabot must not raise this cap (see
    # .github/dependabot.yml). Change it only together with the import migration.
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
antragsplattform-mcp = "antragsplattform_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["antragsplattform_mcp"]
