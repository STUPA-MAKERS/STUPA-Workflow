[project]
name = "antragsplattform-mcp"
version = "0.4.6"
description = "MCP server exposing the antragsplattform API to agents via browser-grant OAuth."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Cap below 2.0: that release moved `mcp.server.fastmcp` into the separate
    # `fastmcp` distribution, so an uncapped install resolves to a version this
    # server cannot import. Dependabot must not raise this cap (see
    # .github/dependabot.yml). Change it only together with the import migration.
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Test and lint tools. CI installs them with `pip install -e '.[dev]'` (job `mcp`).
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "basedpyright>=1.28",
]

[project.scripts]
antragsplattform-mcp = "antragsplattform_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["antragsplattform_mcp"]

# The lint rules of the CI job `mcp`, the same selection as backend/. The list is
# explicit, so a new ruff release with other default rules does not change the result.
# The target is 3.11, not the 3.13 of backend/, because `requires-python` allows 3.11
# and the server runs on the machine of the user.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF100"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = "error"
# The contract tests import the backend app from the same checkout.
extraPaths = ["../backend"]
exclude = [".venv"]
