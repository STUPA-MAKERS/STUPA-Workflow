name = "A module imports only from its layer and from lower layers"
type = "layers"
containers = ["app.modules"]
exhaustive = true
layers = [
    "admin : search : privacy : backup : config_revision : calendar",
    "protocol : livevote : todos : tickets : delegations",
    "voting : budget : applications : flow",
    "forms : application_types : notifications : webhooks : files : media : translations : avatars",
    "gremien : audit : auth : antiabuse : pdf",
]

[[tool.importlinter.contracts]]
id = "shared-imports-no-module"
ignore_imports = [
    "app.shared.config_schemas -> app.modules.admin.branding",
    "app.shared.people -> app.modules.auth.models",
    "app.shared.ws -> app.modules.auth.models",
    "app.shared.ws -> app.modules.auth.principal",
    "app.shared.ws -> app.modules.auth.rbac",
    "app.shared.ws -> app.modules.auth.session_renewal",
    "app.shared.ws -> app.modules.auth.sessions",
    "app.shared.xlsx -> app.modules.applications.schemas",
    "app.shared.xlsx -> app.modules.budget.tree_schemas",
]
name = "The shared code imports no module"
type = "forbidden"
source_modules = ["app.shared", "app.db", "app.settings", "app.logging_config"]
forbidden_modules = ["app.modules"]
allow_indirect_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "ANN", "RUF100", "D",
    # Functional style (specs/style/shared/functional): comprehensions, no appending loop,
    # conditional expressions, no superfluous else after return, no rebound loop variable.
    "C4", "PERF401", "PERF402", "SIM108", "RET", "PLW2901", "FURB",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests type fixtures and fakes loosely. Migrations use the dynamic alembic op API.
"tests/**" = ["C4", "PERF", "SIM108", "RET", "PLW2901", "FURB", "ANN", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
"migrations/**" = ["C4", "PERF", "SIM108", "RET", "PLW2901", "FURB", "ANN"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = "error"
reportDeprecated = "error"
reportUnnecessaryCast = "error"
reportUnusedVariable = "error"
reportConstantRedefinition = "error"
reportMissingTypeArgument = "error"
reportMissingParameterType = "error"
# Functional style (specs/style/shared/functional/000086): a match must cover every case.
reportMatchNotExhaustive = "error"
# Alembic migrations use the dynamic op and context API, so the strict type check skips
# them. The check still covers the models and the logic. env.py stays typed on its own.
exclude = ["migrations/versions", ".venv"]

# Tests take pytest fixtures and fakes as parameters without a type. The default
# environment covers app, worker, scripts and migrations/env.py.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportMissingParameterType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The default run is the fast unit suite and needs no Docker. Integration and e2e tests
# are opt-in through -m.
addopts = "-m 'not integration and not e2e'"
markers = [
    "integration: braucht testcontainers (PG/Redis/MinIO) — Docker erforderlich",
    "e2e: End-to-End gegen ephemeren Compose-Stack",
    "real_rules: the account-merge unit test runs the real erasure and privilege checks",
]

[tool.coverage.run]
branch = true
source = ["app", "worker"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
# Total gate: backend, lines and branches. The unit tests and the integration tests
# count together: each CI job writes its own data file, and the `coverage-gate` job
# combines them and applies this value. The gate sits at 97 %, so real regressions
# break the build and small swings do not turn it red by mistake.
fail_under = 97
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# Critical modules: 100 % branch coverage as a separate gate.
# scripts/coverage_critical.py checks it against coverage.xml. The paths are relative to
# the coverage `source` (= `app`), as coverage.xml lists them, for example
# `modules/auth/oidc.py`. The gate turns on as soon as the path exists. The negative probe
# is tests/test_coverage_gate.py.
# The unit tests and the integration tests count together for this gate too, and the
# `coverage-gate` job in .github/workflows/ci.yml blocks on it. The backup module and
# its worker (`worker/backup.py`) are on the list too.
[tool.coverage_critical]
modules = [
    "modules/auth",
    "modules/voting",
    "modules/flow",
    "modules/budget",
    "modules/webhooks",
    "modules/audit",
    "modules/backup",
    # The SSRF guard of the webhooks lives in app/shared, and the gate follows it.
    "shared/ssrf.py",
    # worker/backup.py: `worker` is its own coverage source, so coverage.xml lists the
    # file as plain `backup.py`.
    "backup.py",
]
min_branch_rate = 1.0
