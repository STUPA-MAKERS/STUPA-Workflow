[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antragsplattform-backend"
version = "0.0.2"
description = "Antragsplattform backend (FastAPI + arq) — Skelett (T-02)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "arq>=0.26",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pydantic[email]>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    # Auth stack (T-10): OIDC token exchange (httpx), id_token verification
    # (PyJWT+crypto), signed cookies and tokens (itsdangerous).
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "itsdangerous>=2.2",
    # Notifications and mail (T-18): Jinja2 templates (subject and body, i18n DE/EN).
    # The arq worker sends the mail over SMTP asynchronously, so the API never blocks.
    "jinja2>=3.1",
    "aiosmtplib>=3.0",
    # Files and uploads (T-13): MIME sniffing (libmagic), MinIO/S3 client with signed
    # URLs, ClamAV scan through clamd. All three load lazily, only on the upload path or
    # the worker path. The contract CI runs Postgres only and never loads them.
    "python-magic>=0.4",
    "minio>=7.2",
    # >=1.0.2: clamd 1.0.1 ships as sdist only and builds through d2to1. d2to1 imports
    # setuptools.dist._get_unpatched, which setuptools>=71 removed, so the build breaks.
    # 1.0.2 ships a wheel. The floor stops the resolver from falling back to 1.0.1.
    "clamd>=1.0.2",
    # Multipart parsing for the file upload (FastAPI UploadFile and Form).
    "python-multipart>=0.0.18",
    # Live vote (T-16): Redis pub/sub fan-out and cast lock (redis.asyncio). arq pulled
    # redis in transitively before. The broker and the locker now use it directly, so the
    # dependency is explicit.
    "redis>=5.0",
    # Excel export (TASKS #2): budget tree and applications as .xlsx, filter aware.
    # Loads lazily, only on the export path. Pure Python package.
    "openpyxl>=3.1",
    # ZUGFeRD/Factur-X import (#invoices): read the embedded CII XML from invoice PDFs.
    # Pure Python, loads lazily, only on the import path. The code uses pypdf directly
    # through our own attachment extractor, because the while loop in pycheval has a bug.
    "pycheval>=0.3,<0.4",
    "pypdf>=6.0",
    # iCal subscription (#ics): RFC5545 feed of the meetings of the user. Loads lazily,
    # only on the feed path. Pure Python package.
    "icalendar>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "coverage[toml]>=7.6",
    "httpx>=0.28",
    # Test infrastructure (testing.md §5): testcontainers (PG/Redis/MinIO), HTTP mock,
    # time freeze, Pydantic and SQLAlchemy factories, contract tests (Schemathesis).
    "testcontainers[postgres,redis]>=4.9",
    "respx>=0.22",
    "freezegun>=1.5",
    "polyfactory>=2.18",
    # The contract runner uses exact pins. schemathesis and hypothesis build random cases
    # on every run. Without a fixed version and a fixed seed (see `--seed` in the CI),
    # `be-contract` turns non-deterministic and passes or fails on the same commit. Exact
    # pins keep a red run reproducible and stop tool updates from moving it.
    "schemathesis==4.22.3",
    "hypothesis==6.165.7",
    "ruff>=0.9",
    "basedpyright>=1.28",
    "testcontainers[postgres]>=4.8",
    "psycopg[binary]>=3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
# Alembic migrations use the dynamic op and context API, so the strict type check skips
# them. The check still covers the models and the logic. env.py stays typed on its own.
exclude = ["migrations/versions", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The default run is the fast unit suite and needs no Docker. Integration and e2e tests
# are opt-in through -m.
addopts = "-m 'not integration and not e2e'"
markers = [
    "integration: braucht testcontainers (PG/Redis/MinIO) — Docker erforderlich",
    "e2e: End-to-End gegen ephemeren Compose-Stack",
]

[tool.coverage.run]
branch = true
source = ["app", "worker"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
# Total gate (testing.md §1): backend, unit tests only, lines and branches. The unit suite
# now reaches 98.7 %. Fakes without a database cover all services, routers and workers.
# The gate sits at 97 %, just below the current value. Real regressions then break the
# build, and small swings do not turn it red by mistake. The goal is to hold or raise the
# 97 %.
fail_under = 97
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# Critical modules: 100 % branch coverage as a separate gate (testing.md §1).
# scripts/coverage_critical.py checks it against coverage.xml. The paths are relative to
# the coverage `source` (= `app`), as coverage.xml lists them, for example
# `modules/auth/oidc.py`. The gate turns on as soon as the path exists. The negative probe
# is tests/test_coverage_gate.py.
# In a pure unit run several of these modules stay far below 100 % branch coverage.
# Integration tests cover oauth, mcp, flow, budget and audit for the most part. The goal
# stays 100 %. The `coverage-gate` job therefore does not block yet (continue-on-error in
# .github/workflows/ci.yml). It reports the distance until the unit branch coverage
# catches up.
[tool.coverage_critical]
modules = [
    "modules/auth",
    "modules/voting",
    "modules/flow",
    "modules/budget",
    "modules/webhooks",
    "modules/audit",
]
min_branch_rate = 1.0
