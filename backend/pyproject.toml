[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antragsplattform-backend"
version = "0.0.2"
description = "Antragsplattform backend (FastAPI + arq) — Skelett"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "arq>=0.26",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pydantic[email]>=2.10",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    # Auth stack: OIDC token exchange (httpx), id_token verification
    # (PyJWT+crypto), signed cookies and tokens (itsdangerous).
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "itsdangerous>=2.2",
    # Notifications and mail: Jinja2 templates (subject and body, i18n DE/EN).
    # The arq worker sends the mail over SMTP asynchronously, so the API never blocks.
    "jinja2>=3.1",
    "aiosmtplib>=3.0",
    # Files and uploads: MIME sniffing (libmagic), MinIO/S3 client with signed
    # URLs, ClamAV scan through clamd. All three load lazily, only on the upload path or
    # the worker path. The contract CI runs Postgres only and never loads them.
    "python-magic>=0.4",
    "minio>=7.2",
    # >=1.0.2: clamd 1.0.1 ships as sdist only and builds through d2to1. d2to1 imports
    # setuptools.dist._get_unpatched, which setuptools>=71 removed, so the build breaks.
    # 1.0.2 ships a wheel. The floor stops the resolver from falling back to 1.0.1.
    "clamd>=1.0.2",
    # Multipart parsing for the file upload (FastAPI UploadFile and Form).
    "python-multipart>=0.0.18",
    # Live vote: Redis pub/sub fan-out and cast lock (redis.asyncio). arq pulled
    # redis in transitively before. The broker and the locker now use it directly, so the
    # dependency is explicit.
    "redis>=5.0",
    # Excel export: budget tree and applications as .xlsx, filter aware.
    # Loads lazily, only on the export path. Pure Python package.
    "openpyxl>=3.1",
    # ZUGFeRD/Factur-X import (#invoices): read the embedded CII XML from invoice PDFs.
    # Pure Python, loads lazily, only on the import path. The code uses pypdf directly
    # through our own attachment extractor, because the while loop in pycheval has a bug.
    "pycheval>=0.3,<0.4",
    "pypdf>=6.0",
    # iCal subscription (#ics): RFC5545 feed of the meetings of the user. Loads lazily,
    # only on the feed path. Pure Python package.
    "icalendar>=6.0",
    # age encryption for the backup archives. pyrage is the rust `age` implementation,
    # so an archive stays readable with the standard `age` CLI off host.
    "pyrage>=1.2",
    # QR code of the join link of a public meeting. segno is BSD-3-Clause, pure
    # Python and has no dependencies. The API sends the module matrix; the browser
    # draws it, so no QR library runs in the frontend bundle.
    "segno>=1.6",
    # Markdown images (media module): decode, strip the metadata, downscale and encode
    # every upload again, so the stored bytes come from Pillow and not from the client.
    # The manylinux wheels bundle libjpeg, libpng, zlib and libwebp, so the slim image
    # needs no system library for it.
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "coverage[toml]>=7.6",
    "httpx>=0.28",
    # Test infrastructure: testcontainers (PG/Redis/MinIO), HTTP mock,
    # time freeze, Pydantic and SQLAlchemy factories, contract tests (Schemathesis).
    "testcontainers[postgres,redis]>=4.9",
    "respx>=0.22",
    "freezegun>=1.5",
    "polyfactory>=2.18",
    # The contract runner uses exact pins. schemathesis and hypothesis build random cases
    # on every run. Without a fixed version and a fixed seed (see `--seed` in the CI),
    # `be-contract` turns non-deterministic and passes or fails on the same commit. Exact
    # pins keep a red run reproducible and stop tool updates from moving it.
    "schemathesis==4.31.1",
    "hypothesis==6.170.0",
    "ruff>=0.9",
    "basedpyright>=1.28",
    # Checks the import contracts of the modules (see `[tool.importlinter]`).
    "import-linter>=2.3",
    "testcontainers[postgres]>=4.8",
    "psycopg[binary]>=3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

# The import contracts (§S/backend/python/000643, 000644). `lint-imports` checks them in the CI
# job `be-lint`. An entry of `ignore_imports` is an import that breaks a contract today
# (000646). `scripts/check_ratchets.py` holds the count of the entries under a baseline, and
# `lint-imports` fails for an entry that matches no import. So the lists can only shrink.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
id = "module-layers"
ignore_imports = [
