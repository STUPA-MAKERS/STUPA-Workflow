# Antragsplattform — docker-compose skeleton (T-01)
# One VM, plain HTTP inside, behind an external Nginx Proxy Manager (the TLS edge).
# The stack holds no TLS, no certificate and no Keycloak. The only host port is `web`
# (127.0.0.1:${WEB_PORT:-8080}). Every other service stays internal, so nothing enters from the
# internet. Egress stays allowed (worker: SMTP/WebDAV/webhooks, pytex: tectonic bundle,
# api: OIDC).
# Reference: sds/deployment.md §1-§5, sds/overview.md §2.

name: antragsplattform

x-restart: &restart
  restart: unless-stopped

services:
  web:
    # Static SPA plus routing /api -> api. The only NPM upstream.
    # The multi-stage image builds the Angular frontend (frontend/), and nginx serves it.
    # The context is the repository root, so frontend/ and deploy/web/nginx.conf are in
    # reach.
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    <<: *restart
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Bound to localhost only. The external NPM proxies here, or through the `proxy`
      # network. `WEB_PORT` moves the host port when 8080 is already taken; the
      # container port stays 80, because nginx.conf listens there.
      - "${WEB_HOST:-127.0.0.1}:${WEB_PORT:-8080}:80"
    volumes:
      # The image already holds nginx.conf. This mount allows a production edit
      # (real_ip CIDR) without a rebuild. The SPA HTML comes from the image.
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
      - proxy
    healthcheck:
      # 127.0.0.1, NOT localhost. The config is mounted read-only, which stops nginx's
      # `10-listen-on-ipv6-by-default.sh` from adding the IPv6 listener, so nginx binds
      # IPv4 only. busybox wget tries ::1 first for `localhost` and gets a refused
      # connection, which left this container permanently unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    # One-shot migrator (issue #38). It runs `alembic upgrade head` against the DB before
    # api and worker start. The run is race-free, because it waits for postgres healthy.
    # It is idempotent, because alembic skips the revisions it already applied. There is
    # no restart loop: the job runs once until exit 0, and api and worker wait for it
    # through `service_completed_successfully`. Migration URL: env.py takes
    # DB_MIGRATION_URL, and DATABASE_URL as the fallback (see .env). The default stack
    # migrates as the app user. The job uses the same backend image as api.
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    # FastAPI on uvicorn --proxy-headers. No host port.
    build:
      context: ../backend
      dockerfile: Dockerfile
    <<: *restart
    env_file: .env
    # Mount the MCP source package read-only, so the self-service download
    # (GET /api/mcp/package) finds the `mcp/` directory. The build context is ../backend
    # only, so that directory is not in the image. MCP_PACKAGE_DIR points to the mount.
    volumes:
      - ../mcp:/opt/mcp:ro
      # The private age key for /admin/backups. Read-only, and absent by default: a
      # stack without it still lists and creates backups, but cannot import or restore
      # one. `:z` relabels for SELinux hosts and is a no-op elsewhere.
      - ./secrets:/secrets:ro,z
    environment:
      MCP_PACKAGE_DIR: /opt/mcp
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      # The internal network carries the egress for OIDC plus the internal services.
      # pytex_net is the render path without egress.
      - internal
      - pytex_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    # arq worker plus cron (deadlines, retries, rollups). No host port.
    build:
      context: ../backend
      dockerfile: Dockerfile
    <<: *restart
    command: ["arq", "worker.main.WorkerSettings"]
    env_file: .env
    volumes:
      # The worker is what actually dumps and restores, so it needs the same key.
      - ./secrets:/secrets:ro,z
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # ClamAV loads its signatures for minutes, so wait for "started" only. The scan
      # task retries until clamd is ready, which keeps the worker unblocked at boot.
      clamav:
        condition: service_started
    networks:
      # The internal network carries the egress for SMTP, WebDAV and webhooks, plus the
      # internal services. pytex_net is the render path.
      - internal
      - pytex_net
    healthcheck:
      test: ["CMD-SHELL", "arq --check worker.main.WorkerSettings || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Bound to localhost only, so there is no external access. It serves the admin CLI
      # on a direct connection, or an SSH port forward to the host.
      # The CLI reads this host port from the compose file (see admin-cli/).
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    # Pinned on purpose (never :latest), for reproducible deploys and a version audit
    # trail. On a bump, note the tag and the date in deploy/README or the notes.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: missing
    <<: *restart
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  clamav:
    # Pinned on purpose (never :latest), for reproducible deploys and a version audit
    # trail. The tag is a 1.x patch tag. On a bump, note the version in the deploy notes.
    image: clamav/clamav:1.4.3
    pull_policy: missing
    <<: *restart
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - internal
    healthcheck:
      # clamd loads its signatures at start for several minutes, hence the long
      # start_period.
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 300s

  pytex:
    # FastAPI wrapper around pytex_api.render_blob (md -> pdf, variant from the
    # frontmatter). pytex v1.1.0. The tectonic bundle lands lazily in pytex_cache
    # (XDG_CACHE_HOME=/cache). POST /render also takes a multipart body that carries
    # a config object and binary assets (uploaded Corporate-Design logos).
    build:
      context: ../pytex
      dockerfile: Dockerfile
    <<: *restart
    env_file: .env
    volumes:
      - pytex_cache:/cache
    networks:
      # ONLY pytex_net, which has no egress (internal: true). The render container needs
      # no internet at runtime. The image already holds the tectonic bundle and biber, and
      # entrypoint.sh seeds the cache. A compile-time read or exec (shell escape)
      # therefore cannot become an exfiltration channel (#sec-audit). api and worker still
      # reach pytex over this network.
      - pytex_net
    # The AUD-009 OS sandbox (read_only rootfs + size/noexec tmpfs + cap_drop ALL) is
    # WITHDRAWN. On a read_only rootfs, tectonic and fontconfig cannot write the font and
    # build cache. The chain is "tectonic failed to produce a PDF (exit 1)" -> pytex 400
    # -> the protocol render aborts at finalize. Add the sandbox again only after a real
    # protocol render verifies the writable paths: the fontconfig cache under
    # `XDG_CACHE_HOME=/cache`, the HOME size and exec on /tmp. (#sec-audit)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8099/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  altcha:
    # Captcha verifier: ALTCHA Sentinel (the official self-hosted image).
    # It listens internally on :8080 and persists to /data. There is NO host port. Only
    # the internal network reaches it at altcha:8080, and nothing enters from the
    # internet. The first login uses root/<ALTCHA_ROOT_PASSWORD> (DEFAULT_ROOT_PASSWORD).
    # The password is mandatory, and deploy.sh blocks an empty value or "root". Sentinel
    # generates the missing secrets (JWT_SECRET, CODE_CHALLENGE_SECRET) itself into
    # /data/.env.
    image: ghcr.io/altcha-org/sentinel:1.31.1
    <<: *restart
    environment:
      DEFAULT_ROOT_PASSWORD: ${ALTCHA_ROOT_PASSWORD}
      ALTCHA_HMAC_SECRET: ${ALTCHA_HMAC_SECRET}
    volumes:
      - altcha_data:/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  # TODO T-04/e2e: add dev profile services here to enable e2e (T-10 auth, captcha and
  # Playwright specs). Add MailHog (SMTP sink) and a dev Keycloak mock under
  # `profiles: [dev]`, so the prod stack stays untouched. They are absent on purpose,
  # because no consumer needs them. See the e2e job in .github/workflows/ci.yml.

volumes:
  pg_data:
  minio_data:
  redis_data:
  clamav_data:
  pytex_cache:
  altcha_data:

networks:
  internal:
    # These services publish no host ports, so nothing enters from the internet.
    # Egress to the internet and the intranet stays allowed for worker and api.
    driver: bridge
  pytex_net:
    # Render path api/worker <-> pytex. `internal: true` means NO egress: the pytex
    # container cannot send anything to the internet. The image already holds tectonic,
    # biber and the cache. This closes an exfiltration channel on compile-time exec
    # (#sec-audit).
    driver: bridge
    internal: true
  proxy:
    # In production this is the external NPM network. Set `external: true` here and
    # reference the network that the Nginx Proxy Manager manages.
    driver: bridge
