# E2E overlay (T-40). Use it ONLY for the Playwright E2E run against the real stack.
# Do NOT use it for production. Load it together with the base stack:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
# Driver: scripts/e2e.sh (own COMPOSE_PROJECT_NAME, own .env, down -v).
#
# On top of the base stack this overlay adds:
#  * mailpit — SMTP sink + HTTP API. It catches the magic-link mails (testing.md §3/§5).
#              It replaces the "MailHog" named in the SDS and keeps the API compatible.
#  * seed    — one-shot job on the backend image. It creates the active form version and
#              the active flow version for the default application type, an admin session
#              and a budget pot. `profiles:[seed]` keeps it out of `up`. Start it on
#              purpose with `run --rm seed` AFTER api is healthy.
#  * web     — reuses the host port that the base stack already binds (127.0.0.1:8080).
#
# The mock stays OFF (#101): there is no mock Keycloak. OIDC stays unconfigured, so the
# login redirect answers 404. The RBAC negative test checks this on purpose. The OIDC,
# live-vote and PDF paths run in the opt-in "full" tier. See scripts/e2e.sh and
# .github/workflows/ci.yml.

services:
  web:
    # Overlay override, the base stack stays untouched. Two e2e-specific changes to
    # web/nginx:
    #  1. `:ro,z` instead of `:ro` for the SELinux relabel (local Fedora or rootless
    #     podman). Without `z`, nginx fails with "Permission denied" on the mounted conf.
    #     On hosts without SELinux (CI, ubuntu docker) `z` is a no-op, as for the backup
    #     service.
    #  2. The healthcheck uses `127.0.0.1` instead of `localhost`. The nginx entrypoint
    #     cannot add the IPv6 listen directive, because compose mounts the conf read-only.
    #     nginx then listens on IPv4 only. In the container `localhost` sometimes resolves
    #     to `::1`, busybox `wget` fails and web stays "unhealthy". The stack then runs
    #     into its timeout and no Playwright run happens. `127.0.0.1` forces IPv4. The
    #     interval is tighter for the gate.
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "5000"
    ports:
      # The HTTP API binds to localhost only. Playwright runs on the host and scrapes the
      # token through it.
      - "127.0.0.1:8025:8025"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  seed:
    build:
      context: ../backend
      dockerfile: Dockerfile
    profiles: ["seed"]
    restart: "no"
    env_file: .env
    environment:
      E2E_ARTIFACTS: /artifacts
    command: ["python", "/seed/seed.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      # `:z` and `,z` request the SELinux relabel (local Fedora or podman).
      # They are a no-op on CI and on ubuntu docker.
      - ./e2e/seed.py:/seed/seed.py:ro,z
      - ./e2e/.artifacts:/artifacts:z
    networks:
      - internal
