# web/nginx.conf — plain HTTP, no TLS. The external NPM terminates TLS.
# sds/deployment.md §2. real_ip from the proxy, WS upgrade, /api proxy, SPA fallback,
# security headers.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cache control (PWA update fix). Content-hashed bundles (main-<hash>.js,
# styles-<hash>.css, fonts, images) never change, so cache them hard. ALL control and
# entry files MUST revalidate: index.html, the service-worker manifest ngsw.json and the
# service worker itself. Without an explicit no-cache the browser applies heuristic
# caching to ngsw.json. The Angular service worker then reads a stale manifest and never
# sees a new deploy. In an nginx `map` an exact match beats a regex, so the worker lines
# and the manifest line override the `.js` pattern.
map $uri $ap_cache_control {
    default                "no-cache";
    ~*\.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|webp|avif|gif|ico)$  "public, max-age=31536000, immutable";
    /ngsw-worker.js        "no-cache";
    /safety-worker.js      "no-cache";
    /worker-basic.min.js   "no-cache";
    /ngsw.json             "no-cache";
}

# Do NOT leak the nginx version in the Server header or on error pages (AUD-068, passive
# recon hardening). This applies in the http context to every server block.
server_tokens off;

server {
    listen 80;
    server_name _;

    # Take the real client IP from the upstream proxy (NPM).
    # IMPORTANT, per security.md §3, which mirrors FORWARDED_ALLOW_IPS in .env.example:
    # enter ONLY the exact IP or CIDR of the DIRECT upstream, the external NPM. NEVER
    # enter whole RFC1918 ranges (/8, /12, /16). If you do, every container in the
    # internal network or the proxy network (172.x) can spoof X-Forwarded-For. That
    # writes a wrong audit client IP and allows a bypass or a lockout of the per-IP rate
    # limits. compose bind-mounts this file, so edit it in production to your own NPM
    # address. The placeholder below matches no sibling container on purpose. real_ip
    # stays a safe no-op and trusts no XFF until someone enters the real proxy IP.
    set_real_ip_from 192.0.2.1;  # RFC5737 TEST-NET-1 placeholder. Replace it in production.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    # Disable unused browser features by default (AUD-068).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Cache policy (see `map $ap_cache_control` above): hashed assets immutable, control
    # files no-cache. It sits at server level next to the security headers, which avoids
    # an add_header clobber.
    add_header Cache-Control $ap_cache_control always;
    # This file does NOT set HSTS (Strict-Transport-Security). TLS terminates at the
    # external NPM (listen 80, plain HTTP). The TLS terminator (NPM) MUST set HSTS.
    # Verify there that NPM emits `Strict-Transport-Security: max-age=...; includeSubDomains`.
    # Set at the HTTP edge it would have no effect, per the spec.

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API proxy -> FastAPI. It passes X-Forwarded-Proto from the NPM through.
    # File upload (T-13): the primary body limit at the edge is 10 MB plus some multipart
    # overhead, applied before the app buffers (security.md §6, anti /tmp DoS). A regex
    # location wins over the /api/ prefix, so this applies to the attachment upload only.
    # The app check (capped read -> 413) stays as defense in depth.
    location ~ ^/api/applications/[^/]+/attachments/?$ {
        client_max_body_size 11m;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Invoice upload (#invoices/ZUGFeRD): a separate, larger body limit. Otherwise the
    # general /api/ limit (1 MB, below) would block real receipt PDFs at the edge with
    # 413. Such PDFs are often larger than 1 MB, up to the in-app limit
    # attachment_max_bytes of 10 MB. A regex location wins over the /api/ prefix, so this
    # applies to the invoice upload routes only.
    location ~ ^/api/invoices/(parse|file)/?$ {
        client_max_body_size 11m;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Public share links (/s/<token>). Server-rendered HTML, NOT the SPA shell: Matrix,
    # WhatsApp and Signal build their previews by fetching the URL server-side and reading
    # the OpenGraph tags out of the response, and a bot that gets the Angular shell sees
    # an empty page. The SPA fallback below would swallow this path, so it has to be
    # proxied explicitly and it has to come first.
    location ~ ^/s/[A-Za-z0-9_-]+/?$ {
        # The share page brings its OWN Content-Security-Policy, and it has to be the
        # only one. Two CSP headers are both enforced, so the effective policy is the
        # intersection — and the server-level `img-src 'self' data:` above then clips
        # the `img-src` this route widens per response for a configured branding logo
        # (share_page.py::share_csp). A logo on its own HTTPS origin is allowed by the
        # app and blocked by nginx, so it silently fails to load.
        #
        # An `add_header` in a location REPLACES the inherited set rather than adding
        # to it, so the one directive below is what drops the server-level CSP. It is
        # not redundant bookkeeping: without an `add_header` here the whole server-level
        # set — CSP included — comes back.
        #
        # Only this one is repeated. The app already sends the rest of the set itself
        # (X-Robots-Tag, Cache-Control, Vary, Referrer-Policy, X-Content-Type-Options,
        # Permissions-Policy and X-Frame-Options), so repeating more would only produce
        # duplicate headers. X-Frame-Options is the one kept at the edge, because a
        # clickjacking defence is worth asserting even if the app ever stops sending it.
        add_header X-Frame-Options "DENY" always;
        client_max_body_size 1m;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /api/ {
        # Primary body limit (security.md §6, review #3). It caps the buffering at the
        # edge before the app reads. It also catches Transfer-Encoding: chunked without a
        # Content-Length. The app caps (magic-link, applications) check more finely on
        # top. File uploads (/api/applications/{id}/attachments) have their own larger
        # location above.
        client_max_body_size 1m;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # WebSocket upgrade for the live vote and similar streams.
    location /api/ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    # OAuth2 discovery (RFC 8414/9728) for MCP clients. Convention puts it at the root, so
    # it needs its own proxy before the SPA fallback instead of serving index.html.
    location ~ ^/\.well-known/oauth-(authorization-server|protected-resource)$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Dynamic PWA manifest. The browser links to `manifest.webmanifest` at the root with
    # a <link rel="manifest"> tag, but the content (name, short_name) follows the active
    # site config. An exact-match location wins over the SPA fallback and over the static
    # file, so this proxies to the backend route, which is mounted under /api.
    # The manifest values scope and start_url stay "./", which is relative to
    # /manifest.webmanifest and therefore "/". The behavior does not change.
    location = /manifest.webmanifest {
        proxy_pass http://api:8000/api/manifest.webmanifest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
