# Local-only Keycloak for OIDC testing. Do NOT use it in production, which runs the real
# idp.reutlingen.university.
# Start: docker compose -f docker-compose.yml -f docker-compose.keycloak.yml up -d
#
# Admin console: http://localhost:8081  (admin / admin)
# Realm: antrag   Client: antragsplattform-demo-local (confidential)   Test user: tester / tester
#
# WARNING: every credential here AND in keycloak/antrag-realm.json (admin/admin,
# tester/tester, the confidential client secret) is a local-dev fixture only. It belongs to
# a throwaway Keycloak that serves http://localhost:8080. NEVER copy or reuse these values
# in a real Keycloak realm or IdP. JSON allows no inline comments, so this warning stands
# here.
#
# The issuer http://host.docker.internal:8081/realms/antrag must resolve the same way for
# the browser AND for the api container:
#   - Browser:    add `127.0.0.1 host.docker.internal` to /etc/hosts once
#   - Container:  extra_hosts host-gateway (below) -> host IP -> published port 8081
# Keycloak start-dev derives the issuer claim from the Host header, so both match.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      # Keycloak imports the realm "antrag", the client and the test user at boot.
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Make host.docker.internal:8081 reachable from the container (native Linux docker).
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
