[project]
name = "antragsplattform-admin"
version = "0.2.0"
description = "Admin REPL for the antragsplattform platform — manage users, roles & permissions, OIDC group-mappings, and view the audit log, straight against the Dockerised Postgres (auto-connects via deploy/.env + the compose file's published port)."
requires-python = ">=3.11"
dependencies = [
    "prompt_toolkit>=3.0.43",
    # The CLI imports psycopg only when DATABASE_URL is set for a direct connection.
    # Docker-exec mode shells out to psql instead. The binary wheel needs no compiler
    # on Linux and macOS.
    "psycopg[binary]>=3.1",
]

[project.scripts]
antragsplattform-admin = "antragsplattform_admin.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["antragsplattform_admin*"]

[project.optional-dependencies]
# Lint tools. The CI job `admin-cli` installs them with `pip install -e '.[dev]'`.
dev = [
    "ruff>=0.9",
    "basedpyright>=1.28",
]

# The same ruff selection as backend/. The target is 3.11, not the 3.13 of backend/,
# because `requires-python` allows 3.11 and the CLI runs on the machine of the admin.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF100"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = "error"
exclude = [".venv", "build"]
