[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antragsplattform-typst"
version = "0.1.0"
description = "typst render service: protocol Markdown to PDF with the HSRT design"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # starlette parses the `multipart/form-data` shape of POST /render with this.
    "python-multipart>=0.0.20",
    # CommonMark + GFM parser. The converter turns its tree into JSON data.
    "marko>=2.1,<3",
    # The frontmatter parser. BaseLoader keeps every scalar a string.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
    "basedpyright>=1.28",
]

[tool.hatch.build.targets.wheel]
packages = ["typst_service"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["vendor", "packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
exclude = ["vendor", "packages", ".venv", "tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: a real `typst compile`; runs when the typst CLI is on PATH",
]
