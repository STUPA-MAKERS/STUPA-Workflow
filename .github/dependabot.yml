# Dependabot opens dependency updates and security-advisory pull requests.
# It mirrors the CI audit gates (be-deps-audit / fe-deps-audit). A new CVE must not
# stay unseen. Dependabot raises a pull request for it. Security updates run
# independently of the weekly version-update window.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
    # Majors that couple to Angular 22 stay excluded (2026-07). That upgrade is a
    # project of its own. It needs a @stupa-makers/ui-kit release, because the peers
    # there are ^20.0.0. Until then these pull requests only turn the build red.
    # Remove these entries during the Angular 22 migration.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-preset-angular"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/angular"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # @types/node follows the CI and runtime Node major (setup-node: 22). A higher
      # major is wrong until Node itself moves up.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 brings a new CSS-first config model. Plan that migration separately.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /pytex
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
