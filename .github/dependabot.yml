# Dependabot — automatische Dependency-Updates + Security-Advisory-PRs.
# Spiegelt die CI-Audit-Gates (be-deps-audit / fe-deps-audit): neue CVEs sollen
# nicht still liegen bleiben, sondern als PR auftauchen. security-updates laufen
# unabhängig vom wöchentlichen version-update-Fenster.
version: 2
updates:
  # Frontend-SPA (npm).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
    # Angular-22-gekoppelte Majors bewusst ausgeblendet (2026-07): das Upgrade ist ein
    # eigenes Projekt (inkl. @stupa-makers/ui-kit-Release, peers ^20.0.0) — bis dahin
    # erzeugen diese PRs nur Rot. Bei der Angular-22-Migration Einträge entfernen.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-preset-angular"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/angular"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # @types/node folgt der CI-/Runtime-Node-Major (setup-node: 22) — Majors darüber
      # hinaus sind falsch, bis Node selbst angehoben wird.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 = neues Config-Modell (CSS-first); Migration separat planen.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # Backend (pip / pyproject).
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # MCP-Server (pip / pyproject).
  - package-ecosystem: pip
    directory: /mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # pytex-Render-Microservice (pip / pyproject).
  - package-ecosystem: pip
    directory: /pytex
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub-Actions selbst aktuell halten (z.B. setup-node/checkout).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
