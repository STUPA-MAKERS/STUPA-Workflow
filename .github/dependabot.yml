# Dependabot opens dependency updates and security-advisory pull requests.
# It mirrors the CI audit gates (be-deps-audit / fe-deps-audit). A new CVE must not
# stay unseen. Dependabot raises a pull request for it. Security updates run
# independently of the weekly version-update window.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
    # TypeScript 7 stays excluded, because Angular 22 accepts only TypeScript >=6.0 <6.1,
    # so that pull request only turns the build red. Remove the entry with the Angular
    # major that accepts TypeScript 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @eslint/js follows the major of eslint, which is 9.
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # @types/node follows the CI and runtime Node major (setup-node: 22). A higher
      # major is wrong until Node itself moves up.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 brings a new CSS-first config model. Plan that migration separately.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # mcp 2.x moved `mcp.server.fastmcp` into the `fastmcp` distribution. The server
    # cannot import it, so pyproject.toml caps mcp below 2.0. Dependabot raised that
    # cap to <3 once. Remove this entry during the mcp 2.x migration.
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /typst
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The images are pinned by digest (spec NF/compatibility/deploy/000981). Dependabot
  # moves a digest when its tag gets new content. A new major or minor version of an
  # image is a decision of a person (postgres must match pg_dump, python and node must
  # match the code), so these entries ignore both.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /typst
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /deploy/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
