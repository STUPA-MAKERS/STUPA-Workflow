# CI gate (testing.md §4). Flat fan-out: all check jobs start in parallel. The
# wall-clock time is the slowest single job (~6-7 min) and not a serial chain
# (~17-20 min). A red pull request blocks (branch protection, see CONTRIBUTING.md).
#
# Deliberate slimming (2026-07):
# - Schemathesis runs with `--max-examples 10` (before: unlimited, up to 30 min).
#   It still finds schema drift and 5xx, only without a deep search.
# - image-build-smoke runs on main pushes only. The Dockerfile changes rarely and
#   deploy builds the image anyway.
# - pip-audit moved to its own workflow (deps-audit.yml): weekly plus main pushes.
# - All backend jobs cache pip (setup-python). This saves about 45 s per job.
# - e2e, restore-smoke and real-stack-smoke stay opt-in (label, dispatch or variable).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Opt-in trigger for the e2e job (see its `if:` gate). Start it by hand with
  # Actions → Run workflow. Without this trigger the workflow_dispatch opt-in of
  # the e2e job stays unreachable.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  # clamd<=1.0.1 and text-unidecode build through d2to1. d2to1 imports
  # setuptools.dist._get_unpatched, which setuptools>=71 removed, so the sdist build
  # breaks. Both projects ship wheels. Force the wheel for these two packages only.
  # Everything else still builds from source. The force also stops a resolver
  # backtrack onto an sdist-only version from breaking the build again.
  PIP_ONLY_BINARY: "clamd,text-unidecode"
  PIP_PREFER_BINARY: "1"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  be-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      # `ruff format --check` runs locally through pre-commit (.pre-commit-config.yaml).
      # CI runs the lint only, because the T-02 skeleton is not fully formatted yet.

  be-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: basedpyright
        run: basedpyright

  be-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Pytest (Unit) + Coverage
        # The fail_under setting (pyproject [tool.coverage.report]) breaks the build
        # here already.
        run: pytest --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # The integration suite starts Postgres and Redis through testcontainers.
  be-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Pytest (Integration, Docker)
        run: pytest -m integration

  be-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # This job needs a real Postgres instance. Since T-10 the auth endpoints touch
    # the DB. Without a DB they answer 5xx and break `not_a_server_error`. OIDC stays
    # unconfigured on purpose. /auth/login and /auth/callback then answer 404, so the
    # job runs without an external Keycloak.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: antrag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: "postgresql+asyncpg://app:pw@localhost:5432/antrag_test"
      SESSION_SECRET: "ci-session-secret"
      MAGIC_LINK_SECRET: "ci-magic-link-secret"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Migrationen (alembic upgrade head)
        run: alembic upgrade head
      - name: App starten
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break || sleep 1
          done
      - name: Schemathesis
        # Full contract checks with two deliberate exceptions:
        # - `unsupported_method` demands the RFC-9110 `Allow` header on a 405. That
        #   belongs in the error-contract handler (T-02), not here.
        # - `positive_data_acceptance` expects 2xx for schema-valid input. For the
        #   auth endpoints (T-10) schema-valid is not the same as semantically valid.
        #   A well-formed but unknown magic-link token correctly gives 410. A random
        #   OIDC `code` or `state` gives 400 or 404. These 4xx answers are wanted.
        #
        # A fixed `--seed` plus pinned schemathesis and hypothesis (pyproject) keep the
        # run deterministic. `--max-examples 10` comes from the CI slimming (2026-07).
        # Unlimited examples ran the job up to 30 min. Ten examples per operation still
        # find schema drift and 5xx reliably.
        run: >
          schemathesis run http://127.0.0.1:8000/openapi.json
          --checks all
          --exclude-checks unsupported_method,positive_data_acceptance
          --max-examples 10
          --seed 1337

  fe-unit:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # @stupa-makers/ui-kit lives at frontend/vendor/ui-kit as a git submodule.
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint --if-present
      - name: tsc
        run: npx tsc --noEmit
      - name: Jest + Coverage (Gate 80 %)
        # The threshold sits in jest.config (coverageThreshold global 80). A miss
        # breaks the build.
        run: npm test -- --coverage --watch=false
      - name: Build
        run: npm run build

  # Playwright end-to-end tests against the real compose stack. Opt-in (T-40).
  # Deterministic core journeys run against the REAL stack. The mock is off since
  # #101. A mailpit SMTP sink and a seed service support the run. Keycloak, pytex and
  # ClamAV stay off the gate path. scripts/e2e.sh starts the stack, seeds it, runs
  # Playwright and cleans up with `down -v`.
  e2e:
    runs-on: ubuntu-latest
    needs: [detect, be-unit, fe-unit]
    # Three ways to opt in:
    #   - by hand:   Actions → Run workflow (workflow_dispatch)
    #   - per PR:    set the label `run-e2e`
    #   - permanent: repo variable RUN_E2E=true
    if: >-
      needs.detect.outputs.frontend == 'true'
      && (
        github.event_name == 'workflow_dispatch'
        || contains(github.event.pull_request.labels.*.name, 'run-e2e')
        || vars.RUN_E2E == 'true'
      )
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: FE-Deps + Playwright-Browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E (vs echtem Stack)
        run: scripts/e2e.sh
      - name: Playwright-Report (immer — Beweis >0 Tests)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  # The overall gate already breaks in be-unit. This job adds the stricter gate for
  # the critical modules (100 % branch, testing.md §1). It needs only the be-unit
  # artifact.
  coverage-gate:
    runs-on: ubuntu-latest
    needs: be-unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend
      - name: Kritische Module 100 % Branch
        working-directory: backend
        # BLOCKING: auth, voting, flow, budget, webhooks and audit now reach 100 %
        # branch in the pure unit suite (fakes without a DB). The gate holds that
        # state. If a critical module drops below 100 % branch, the build breaks.
        run: python -m scripts.coverage_critical coverage.xml pyproject.toml

  # Image build plus smoke test, on main only (CI slimming 2026-07). The Dockerfile
  # changes rarely and deploy builds the image anyway. On a pull request the job
  # stays neutral (skipped). On main pushes and manual runs it still blocks.
  image-build-smoke:
    runs-on: ubuntu-latest
    needs: coverage-gate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: Backend-Image bauen
        run: docker build -t antrag-backend:ci backend
      - name: Container-Smoke (/api/health)
        run: |
          docker run -d --name api-smoke -p 8000:8000 \
            -e DATABASE_URL="postgresql+asyncpg://app:pw@localhost/antrag_test" \
            -e SESSION_SECRET="ci-session-secret" \
            -e MAGIC_LINK_SECRET="ci-magic-link-secret" \
            -e FORWARDED_ALLOW_IPS="*" \
            antrag-backend:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && ok=1 && break || sleep 1
          done
          docker logs api-smoke
          docker rm -f api-smoke
          [ "${ok:-0}" = "1" ] || { echo "Smoke fehlgeschlagen"; exit 1; }

  pytex:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pytex
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pytex/pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: basedpyright
        run: basedpyright
      - name: Pytest
        # Unit suite only. The real-render tests are opt-in (RUN_PYTEX_INTEGRATION).
        run: pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config -q

  # Restore smoke test. It proves the backup-to-restore round against a throwaway stack
  # (DB + MinIO), driving the real service and worker code inside the backend image.
  # Opt-in like e2e, because it builds that image and runs a full migrate. That is too
  # heavy and too slow for every pull request. A default run shows up as *skipped*
  # (neutral) and does not block. Three ways to opt in:
  #   - by hand:   Actions → Run workflow (workflow_dispatch)
  #   - per PR:    set the label `run-restore-smoke`
  #   - permanent: repo variable RUN_RESTORE_SMOKE=true
  restore-smoke:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'run-restore-smoke')
      || vars.RUN_RESTORE_SMOKE == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Restore-Smoke (backup -> wipe -> restore -> verify)
        run: scripts/restore-smoke.sh

  # Real-stack smoke test (process fix). It starts the FULL compose stack with the
  # mock off and a bootstrap admin set. It then checks the core flows over HTTP and
  # WS only: API up, /api/health, the public and auth paths, and the WS handshake.
  # Use it to test a whole wave of work against the real stack. Opt-in like e2e and
  # restore-smoke, because a full build plus the ClamAV load is too heavy for every
  # pull request. A default run shows up as *skipped* (neutral) and does not block.
  # Three ways to opt in:
  #   - by hand:   Actions → Run workflow (workflow_dispatch)
  #   - per PR:    set the label `run-real-stack-smoke`
  #   - permanent: repo variable RUN_REAL_STACK_SMOKE=true
  real-stack-smoke:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'run-real-stack-smoke')
      || vars.RUN_REAL_STACK_SMOKE == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Real-Stack-Smoke (compose up -> HTTP/WS-Kernflüsse)
        run: scripts/smoke-real-stack.sh
