# CI gate. Flat fan-out: all check jobs start in parallel. The
# wall-clock time is the slowest single job (~6-7 min) and not a serial chain
# (~17-20 min). A red pull request blocks (branch protection).
#
# Deliberate slimming (2026-07):
# - Schemathesis runs with `--max-examples 10` (before: unlimited, up to 30 min).
#   It still finds schema drift and 5xx, only without a deep search.
# - image-build-smoke runs on main pushes only. The Dockerfile changes rarely and
#   deploy builds the image anyway.
# - pip-audit moved to its own workflow (deps-audit.yml): weekly plus main pushes.
# - All backend jobs cache pip (setup-python). This saves about 45 s per job.
# - e2e, restore-smoke and real-stack-smoke stay opt-in (label, dispatch or variable).
# - axe runs the axe sweep of e2e on every frontend change; it is a gate (spec ui-kit:000491).
name: ci

on:
  push:
    branches: [main, development]
  pull_request:
  # Opt-in trigger for the e2e job (see its `if:` gate). Start it by hand with
  # Actions → Run workflow. Without this trigger the workflow_dispatch opt-in of
  # the e2e job stays unreachable.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  # clamd<=1.0.1 and text-unidecode build through d2to1. d2to1 imports
  # setuptools.dist._get_unpatched, which setuptools>=71 removed, so the sdist build
  # breaks. Both projects ship wheels. Force the wheel for these two packages only.
  # Everything else still builds from source. The force also stops a resolver
  # backtrack onto an sdist-only version from breaking the build again.
  PIP_ONLY_BINARY: "clamd,text-unidecode"
  PIP_PREFER_BINARY: "1"

jobs:
  # The parts of the repository that this change needs (specs 001240-001244). The job
  # compares HEAD with the newest green CI run whose commit is an ancestor of HEAD and
  # sets one flag per part. A job of a part that did not change is skipped, and a
  # skipped job counts as green. Without a green base every part runs.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads the earlier runs of this workflow.
      actions: read
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      stack: ${{ steps.scope.outputs.stack }}
      mcp: ${{ steps.scope.outputs.mcp }}
      typst: ${{ steps.scope.outputs.typst }}
      admin_cli: ${{ steps.scope.outputs.admin_cli }}
      compose: ${{ steps.scope.outputs.compose }}
      functional: ${{ steps.scope.outputs.functional }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The base is an older commit, so the job needs the history.
          fetch-depth: 0
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_scope.py

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `implementation` paths in the specs point into the ui-kit submodule.
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # Checks the format of every spec, the index and every § reference in the code. The kit
      # specs come from the submodule: one number space, `§ui-kit:` references (ui-kit:002211, 002212).
      - run: python3 scripts/check_specs.py
        env:
          PARTNER_SPECS: frontend/vendor/ui-kit/specs
      # The UML views in specs/uml are current and well formed (specs 000679-000684). The
      # script imports the backend models and reads its import graph.
      - run: pip install -e 'backend[dev]'
      - run: python3 scripts/build_uml.py --check
      # The schema files and the examples of the protocol specs (specs 000958, 000959).
      - run: python3 scripts/check_protocols.py

  # Functional style ratchet (specs/style/shared/functional/000437): the count of violations
  # per Python file must not rise above scripts/functional-baseline/. fe-unit checks the
  # frontend part with the ESLint report.
  functional:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.functional == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python3 scripts/check_functional.py
      # Service commits, fake sessions and import exceptions can only go down
      # (specs 000640, 000642, 000651).
      - run: python3 scripts/check_ratchets.py
      # Images and actions are pinned, and a build download repeats (specs 000978, 000981).
      - run: python3 scripts/check_build_pins.py

  be-lint:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      # The layers of the modules and the shared code (specs 000643, 000644). An entry of
      # `ignore_imports` that matches no import fails too (000651).
      - name: Import contracts
        run: lint-imports
      # `ruff format --check` runs locally through pre-commit (.pre-commit-config.yaml).
      # CI runs the lint only, because the code base is not fully formatted yet.

  be-typecheck:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: basedpyright
        run: basedpyright

  be-unit:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Pytest (Unit) + Coverage
        # The unit tests and the integration tests count together for the gate, so
        # this job only records its coverage data. The `coverage-gate` job combines
        # both data files and applies fail_under.
        env:
          COVERAGE_FILE: .coverage.unit
        run: pytest --cov --cov-report=term-missing --cov-fail-under=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-coverage-unit
          path: backend/.coverage.unit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The integration suite starts Postgres and Redis through testcontainers.
  be-integration:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Pytest (Integration, Docker) + Coverage
        env:
          COVERAGE_FILE: .coverage.integration
        run: pytest -m integration --cov --cov-report= --cov-fail-under=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-coverage-integration
          path: backend/.coverage.integration
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Upgrade path of production: the baseline builds a fresh database from the models of
  # the same commit, so on a fresh database a later migration finds its tables and
  # columns in place and changes nothing. This job builds the database with the code of
  # the newest release tag, runs the migrations of this commit on it and compares the
  # result with the models. The tag code runs in its own virtualenv, because its
  # dependencies can differ from the dependencies of this commit.
  be-migrations:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: antrag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: "postgresql+asyncpg://app:pw@localhost:5432/antrag_test"
      SESSION_SECRET: "ci-session-secret"
      MAGIC_LINK_SECRET: "ci-magic-link-secret"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Code of the newest release tag
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          test -n "$tag"
          echo "Newest release tag: $tag"
          git worktree add ../release "$tag"
      - name: Database with the schema of the release
        working-directory: ../release/backend
        run: |
          python -m venv ../../release-venv
          ../../release-venv/bin/pip install -e .
          ../../release-venv/bin/alembic upgrade head
      - name: Migrations of this commit on that database
        working-directory: backend
        run: |
          pip install -e .
          alembic upgrade head
      - name: Schema equals the models
        working-directory: backend
        run: python -m app.shared.schema_drift --strict

  be-contract:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    # This job needs a real Postgres instance. The auth endpoints touch
    # the DB. Without a DB they answer 5xx and break `not_a_server_error`. OIDC stays
    # unconfigured on purpose. /auth/login and /auth/callback then answer 404, so the
    # job runs without an external Keycloak.
    services:
      postgres:
        image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: antrag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: "postgresql+asyncpg://app:pw@localhost:5432/antrag_test"
      SESSION_SECRET: "ci-session-secret"
      MAGIC_LINK_SECRET: "ci-magic-link-secret"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Migrationen (alembic upgrade head)
        run: alembic upgrade head
      - name: App starten
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break || sleep 1
          done
      - name: Schemathesis
        # Full contract checks with two deliberate exceptions:
        # - `unsupported_method` demands the RFC-9110 `Allow` header on a 405. That
        #   belongs in the error-contract handler, not here.
        # - `positive_data_acceptance` expects 2xx for schema-valid input. For the
        #   auth endpoints schema-valid is not the same as semantically valid.
        #   A well-formed but unknown magic-link token correctly gives 410. A random
        #   OIDC `code` or `state` gives 400 or 404. These 4xx answers are wanted.
        #
        # A fixed `--seed` plus pinned schemathesis and hypothesis (pyproject) keep the
        # run deterministic. `--max-examples 10` comes from the CI slimming (2026-07).
        # Unlimited examples ran the job up to 30 min. Ten examples per operation still
        # find schema drift and 5xx reliably.
        run: >
          schemathesis run http://127.0.0.1:8000/openapi.json
          --checks all
          --exclude-checks unsupported_method,positive_data_acceptance
          --max-examples 10
          --seed 1337

  fe-unit:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # @stupa-makers/ui-kit lives at frontend/vendor/ui-kit as a git submodule.
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint --if-present
      - name: Functional style ratchet
        # specs/style/shared/functional/000437: the functional warnings per file must not
        # rise above scripts/functional-baseline/frontend-*.json.
        run: |
          npx eslint . -f json -o eslint-report.json
          python3 ../scripts/check_functional.py --eslint eslint-report.json
      - name: Typecheck
        # The root tsconfig.json lists no files, so a bare `tsc --noEmit` checks
        # nothing. `typecheck` runs tsc against tsconfig.app.json.
        run: npm run typecheck
      - name: Typecheck specs
        run: npm run typecheck:spec
      - name: Jest + Coverage (Gate 80 %)
        # The threshold sits in jest.config (coverageThreshold global 80). A miss
        # breaks the build.
        run: npm test -- --coverage --watch=false
      - name: Build
        run: npm run build

  # Playwright end-to-end tests against the real compose stack. Opt-in.
  # Deterministic core journeys run against the REAL stack. The mock is off.
  # A mailpit SMTP sink and a seed service support the run. Keycloak, typst and
  # ClamAV stay off the gate path. scripts/e2e.sh starts the stack, seeds it, runs
  # Playwright and cleans up with `down -v`.
  e2e:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    needs: [detect, be-unit, fe-unit]
    # Three ways to opt in:
    #   - by hand:   Actions → Run workflow (workflow_dispatch)
    #   - per PR:    set the label `run-e2e`
    #   - permanent: repo variable RUN_E2E=true
    if: >-
      !cancelled()
      && needs.detect.outputs.stack == 'true'
      && !contains(needs.*.result, 'failure')
      && (
        github.event_name == 'workflow_dispatch'
        || contains(github.event.pull_request.labels.*.name, 'run-e2e')
        || vars.RUN_E2E == 'true'
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: FE-Deps + Playwright-Browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Docker Hub limits anonymous pulls per runner IP and answers 429. A login
      # raises the limit. A fork or a pull request without the secrets skips the
      # login and pulls anonymously.
      - name: Docker Hub login
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: E2E (vs echtem Stack)
        run: scripts/e2e.sh
      - name: Playwright-Report (immer — Beweis >0 Tests)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  # axe on every route in both themes (spec ui-kit:000491), against the real stack. Unlike the
  # full e2e run it is not opt-in: an accessibility regression fails the PR. It runs only
  # e2e/06-axe.spec.ts, so it stays a few minutes.
  axe:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    needs: [detect, fe-unit]
    # A backend change runs axe without fe-unit, so a skipped fe-unit does not stop it.
    if: >-
      !cancelled()
      && needs.detect.outputs.stack == 'true'
      && contains(fromJSON('["success", "skipped"]'), needs.fe-unit.result)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: FE-Deps + Playwright-Browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Docker Hub login
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: axe sweep (vs echtem Stack)
        run: scripts/e2e.sh e2e/06-axe.spec.ts
      - name: Playwright-Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: axe-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  # The coverage gates of the backend. The unit tests and the integration tests count
  # together: the job combines the data files of both jobs, applies the overall gate
  # (fail_under in pyproject) and then the stricter gate for the critical modules
  # (100 % branch).
  coverage-gate:
    runs-on: ubuntu-latest
    needs: [be-unit, be-integration]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # The same install as the test jobs, so the coverage version that reads the
      # data files is the version that wrote them.
      - run: pip install -e '.[dev]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: backend-coverage-*
          path: backend
          merge-multiple: true
      - name: Combine unit and integration coverage
        run: coverage combine .coverage.unit .coverage.integration
      - name: Gesamt-Gate (fail_under)
        run: coverage report --skip-covered
      - name: Kritische Module 100 % Branch
        # BLOCKING: if a critical module drops below 100 % branch, the build breaks.
        run: |
          coverage xml
          python -m scripts.coverage_critical coverage.xml pyproject.toml

  # Image build plus smoke test, on main only (CI slimming 2026-07). The Dockerfile
  # changes rarely and deploy builds the image anyway. On a pull request the job
  # stays neutral (skipped). On main pushes and manual runs it still blocks.
  image-build-smoke:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    needs: coverage-gate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Docker Hub limits anonymous pulls per runner IP and answers 429. A login
      # raises the limit. A fork or a pull request without the secrets skips the
      # login and pulls anonymously.
      - name: Docker Hub login
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Backend-Image bauen
        run: docker build -t antrag-backend:ci backend
      - name: Container-Smoke (/api/health)
        run: |
          docker run -d --name api-smoke -p 8000:8000 \
            -e DATABASE_URL="postgresql+asyncpg://app:pw@localhost/antrag_test" \
            -e SESSION_SECRET="ci-session-secret" \
            -e MAGIC_LINK_SECRET="ci-magic-link-secret" \
            -e FORWARDED_ALLOW_IPS="*" \
            antrag-backend:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && ok=1 && break || sleep 1
          done
          docker logs api-smoke
          docker rm -f api-smoke
          [ "${ok:-0}" = "1" ] || { echo "Smoke fehlgeschlagen"; exit 1; }

  typst:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.typst == 'true'
    defaults:
      run:
        working-directory: typst
    env:
      # Keep in step with typst/Dockerfile. The layout tests pin the pytex geometry,
      # and a compiler bump can move text.
      TYPST_VERSION: "0.15.1"
      TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The HSRT design (fonts, logos) comes from the hsrtreport-typst submodule.
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: typst/pyproject.toml
      - name: Install typst and poppler
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  /tmp/typst.tar.xz" | sha256sum -c -
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends poppler-utils
          typst --version
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: basedpyright
        run: basedpyright
      - name: Pytest
        # With typst on PATH the integration tests run too, including the layout
        # checks against the pytex geometry.
        run: pytest

  # The MCP server (mcp/) is a separate package with its own tests. Without this job a
  # wrong API path in a tool reaches development unseen. This job runs
  # in the same flat fan-out as the others. It is meant as a required check: a red
  # result blocks a pull request only when the branch protection lists the job.
  mcp:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.mcp == 'true'
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: mcp/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: basedpyright
        run: basedpyright
      - name: Pytest
        run: pytest -q

  # The admin CLI (admin-cli/) has no tests. This job runs the same lint and type
  # check as the other Python packages, so the CLI keeps one configuration with them.
  admin-cli:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.admin_cli == 'true'
    defaults:
      run:
        working-directory: admin-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: admin-cli/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: basedpyright
        run: basedpyright

  compose:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.compose == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate docker-compose
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config -q

  # Restore smoke test. It proves the backup-to-restore round against a throwaway stack
  # (DB + MinIO), driving the real service and worker code inside the backend image.
  # Opt-in like e2e, because it builds that image and runs a full migrate. That is too
  # heavy and too slow for every pull request. A default run shows up as *skipped*
  # (neutral) and does not block. Three ways to opt in:
  #   - by hand:   Actions → Run workflow (workflow_dispatch)
  #   - per PR:    set the label `run-restore-smoke`
  #   - permanent: repo variable RUN_RESTORE_SMOKE=true
  restore-smoke:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'run-restore-smoke')
      || vars.RUN_RESTORE_SMOKE == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Docker Hub limits anonymous pulls per runner IP and answers 429. A login
      # raises the limit. A fork or a pull request without the secrets skips the
      # login and pulls anonymously.
      - name: Docker Hub login
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Restore-Smoke (backup -> wipe -> restore -> verify)
        run: scripts/restore-smoke.sh

  # Real-stack smoke test (process fix). It starts the FULL compose stack with the
  # mock off and a bootstrap admin set. It then checks the core flows over HTTP and
  # WS only: API up, /api/health, the public and auth paths, and the WS handshake.
  # Use it to test a whole wave of work against the real stack. Opt-in like e2e and
  # restore-smoke, because a full build plus the ClamAV load is too heavy for every
  # pull request. A default run shows up as *skipped* (neutral) and does not block.
  # Three ways to opt in:
  #   - by hand:   Actions → Run workflow (workflow_dispatch)
  #   - per PR:    set the label `run-real-stack-smoke`
  #   - permanent: repo variable RUN_REAL_STACK_SMOKE=true
  real-stack-smoke:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'run-real-stack-smoke')
      || vars.RUN_REAL_STACK_SMOKE == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job builds the `web` image, which compiles the Angular app against the
          # `@stupa-makers/ui-kit` submodule. Without this the build cannot resolve the
          # package and the job fails before it reaches a single smoke assertion.
          submodules: recursive
      # Docker Hub limits anonymous pulls per runner IP and answers 429. A login
      # raises the limit. A fork or a pull request without the secrets skips the
      # login and pulls anonymously.
      - name: Docker Hub login
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Real-Stack-Smoke (compose up -> HTTP/WS-Kernflüsse)
        run: scripts/smoke-real-stack.sh

  # One check that sums up the run (spec 001244). It needs every job, runs always and
  # fails when a job failed or was cancelled. A skipped job counts as green. The branch
  # protection must require this check (spec 000628): when `detect` fails, every other
  # job is skipped, and only this job turns red.
  ci-ok:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - detect
      - specs
      - functional
      - be-lint
      - be-typecheck
      - be-unit
      - be-integration
      - be-migrations
      - be-contract
      - fe-unit
      - e2e
      - axe
      - coverage-gate
      - image-build-smoke
      - typst
      - mcp
      - admin-cli
      - compose
      - restore-smoke
      - real-stack-smoke
    steps:
      - name: Every job is green or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          test "$(echo "$NEEDS" | jq -r '.detect.result')" = success
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "Not green: $bad"
            exit 1
          fi
