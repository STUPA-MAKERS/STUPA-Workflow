<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>STUPA Antragsplattform</title>
    <base href="/" />
    <!-- Pinch zoom stays on (WCAG 1.4.4): the inputs are 16 px, so iOS does not zoom on
         focus. viewport-fit=cover draws under the notch and the home bar; the shell keeps
         its chrome clear of them with the safe-area insets. interactive-widget makes the
         on-screen keyboard shrink the layout viewport (Android), so a pinned composer, a
         FAB or a sheet stays above the keyboard; the bottom bar steps aside while a text
         field has the focus (styles.scss). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Browser and PWA bars follow the page background of the theme. ThemeService sets
         both tags to the chosen theme when the user picks one in the app, and links the
         dark manifest (?scheme=dark) in the dark theme, because an installed Android app
         takes its bar colours from the manifest. -->
    <meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101211" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Antragsplattform des Studierendenparlaments — Anträge, Abstimmungen, Sitzungsprotokolle und Budget."
    />
    <link rel="icon" type="image/svg+xml" href="assets/logos/stupa-mark.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iOS and iPadOS do not read the icons of the manifest. "Add to Home Screen" takes
         this 180 px icon. It is opaque, because iOS fills a transparent area with black.
         The capable tags make iOS before 16.4 open the home screen icon as a standalone
         app and not as a Safari tab; later versions read display from the manifest. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="STUPA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Bitte JavaScript aktivieren, um die Anwendung zu nutzen.</noscript>
  </body>
</html>
