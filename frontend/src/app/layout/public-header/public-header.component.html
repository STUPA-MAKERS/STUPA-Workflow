<header class="pub" [class.pub--under]="under()">
  <nav class="pub__nav" [attr.aria-label]="'nav.main' | t">
    <a class="pub__brand" routerLink="/" [attr.aria-label]="branding.appName()">
      <img class="pub__logo" [src]="logoSrc()" alt="" />
      <img class="pub__mark" [src]="markSrc()" alt="" />
    </a>
  </nav>
  <span class="pub__spacer"></span>

  <app-language-select class="pub__lang" [label]="'lang.switch' | t" display="code" />

  <app-help-menu class="pub__help" variant="header" menu="a11y" />

  <app-help-menu class="pub__help" variant="header" />

  @if (auth.applicantSession()) {
    <app-button class="pub__login" variant="outlined" (click)="auth.logout()">{{ 'action.logout' | t }}</app-button>
  } @else if (!auth.isAuthenticated()) {
    <a class="pub__login" appButton="outlined" routerLink="/login">{{ 'action.login' | t }}</a>
  }
</header>
