<a class="skip-link" href="#main">{{ 'app.skipToContent' | t }}</a>

<div
  class="frame"
  [class.frame--rail]="frame() === 'rail' && !phone()"
  [class.frame--phone]="frame() === 'rail' && phone()"
  [class.frame--keyboard]="frame() === 'rail' && phone() && keyboard()"
  [class.frame--fab]="frame() === 'rail' && phone() && fab()"
  [class.frame--public]="frame() === 'public'"
  [class.frame--bare]="frame() === 'bare'"
>
  @if (frame() === 'rail' && !phone()) {
    <app-nav-rail class="frame__rail" />
  }

  <div class="frame__body">
    @if (frame() === 'public') {
      <app-public-header />
    }

    <main
      id="main"
      class="main"
      [class.page-shell]="frame() !== 'bare'"
      [class.main--wide]="wide()"
      [class.main--fill]="fill()"
      tabindex="-1"
    >
      <router-outlet />
    </main>

    @if (footer()) {
      <app-site-footer class="frame__footer" />
    }
  </div>

  @if (frame() === 'rail' && phone()) {
    <app-bottom-bar />
  }
</div>

<app-load-bar />
<app-toast />
<app-sw-update-prompt />

@if (help.reportUsed()) {
  @defer {
    <app-report-dialog />
  }
}

@if (frame() === 'rail') {
  <app-command-palette />
}
