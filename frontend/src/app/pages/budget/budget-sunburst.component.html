<div class="relative flex flex-col items-center gap-3 pt-2 pb-5 px-2" (pointermove)="onMove($event)" (pointerleave)="hovered.set(null)">
  @if (total() > 0) {
    <svg [attr.viewBox]="'0 0 ' + SIZE + ' ' + SIZE" class="sb__svg" role="img" [attr.aria-label]="root()?.name ?? ''">
      @for (s of segments(); track s.id + ':' + s.depth) {
        <path
          [attr.d]="s.d"
          [attr.fill]="s.color"
          [attr.fill-opacity]="s.opacity"
          class="sb__seg"
          [class.sb__seg--dim]="hovered() !== null && hovered()?.id !== s.id"
          (pointerenter)="hovered.set(s)"
          (click)="nodeClick.emit(s.id)"
        />
      }
      <circle [attr.cx]="CX" [attr.cy]="CY" [attr.r]="R_CENTER - 6" class="sb__center" (click)="rootClick()" />
      <text [attr.x]="CX" [attr.y]="CY - 6" text-anchor="middle" class="sb__center-name">{{ root()?.name }}</text>
      <text [attr.x]="CX" [attr.y]="CY + 14" text-anchor="middle" class="sb__center-val">{{ total() | money: { whole: true } }}</text>
    </svg>
    @if (hovered(); as h) {
      <div class="sb__tip" [style.left.px]="tip().x" [style.top.px]="tip().y" role="status">
        <strong>{{ h.name }}</strong>
        <span class="text-muted">{{ h.pathKey | simplifyPath }}</span>
        <span>{{ h.value | money: { whole: true } }} · {{ h.percent }}%</span>
      </div>
    }
  } @else {
    <svg
      [attr.viewBox]="'0 0 ' + SIZE + ' ' + SIZE"
      class="sb__svg sb__svg--empty"
      role="img"
      [attr.aria-label]="'budget.pie.emptyLabel' | t: { name: root()?.name ?? '' }"
    >
      <circle [attr.cx]="CX" [attr.cy]="CY" [attr.r]="R_EMPTY" [attr.stroke-width]="W_EMPTY" class="sb__ring" />
      <circle [attr.cx]="CX" [attr.cy]="CY" [attr.r]="R_CENTER - 6" class="sb__center sb__center--empty" />
      <text [attr.x]="CX" [attr.y]="CY - 6" text-anchor="middle" class="sb__center-name">{{ root()?.name }}</text>
      <text [attr.x]="CX" [attr.y]="CY + 14" text-anchor="middle" class="sb__center-val">{{ 0 | money: { whole: true } }}</text>
    </svg>
  }
</div>
