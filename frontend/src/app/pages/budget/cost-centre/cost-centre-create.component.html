<app-dialog [open]="open()" [title]="'budget.cc.create' | t" [closeLabel]="'action.close' | t" (closed)="closed.emit()">
  <form id="cc-create-form" class="ccc" (submit)="submit($event)">
    <app-select
      name="ccParent"
      [label]="'budget.cc.parent' | t"
      [required]="true"
      [options]="parentOptions()"
      [ngModel]="parentId()"
      (ngModelChange)="parentId.set($event ?? '')"
    />
    <div class="ccc__pair">
      <app-input
        class="ccc__key"
        name="ccKey"
        [label]="'budget.tree.key' | t"
        [required]="true"
        [ngModel]="key()"
        (ngModelChange)="key.set($event)"
      />
      <app-input name="ccName" [label]="'budget.tree.name' | t" [required]="true" [ngModel]="name()" (ngModelChange)="name.set($event)" />
    </div>
    @if (sided()) {
      <div class="ccc__side">
        <span class="ccc__label">{{ 'budget.cc.side' | t }}</span>
        <app-segmented
          width="equal"
          size="control"
          [ariaLabel]="'budget.cc.side' | t"
          [options]="sides()"
          [value]="side()"
          (valueChange)="side.set($any($event))"
        />
      </div>
    }
    @if (versionId()) {
      <app-currency-input name="ccAmount" [label]="amountLabel()" [ngModel]="amount()" (ngModelChange)="amount.set($event)" />
    }
    <button type="submit" hidden></button>
  </form>
  <div dialog-footer class="ccc__foot">
    <app-button variant="text" (click)="closed.emit()">{{ 'action.cancel' | t }}</app-button>
    <app-button variant="fill" (click)="submit($event)" [disabled]="!valid() || busy()">{{ 'budget.cc.createSubmit' | t }}</app-button>
  </div>
</app-dialog>
