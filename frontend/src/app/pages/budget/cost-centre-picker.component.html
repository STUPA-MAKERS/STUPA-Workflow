<div class="ccp__box">
  <span class="ccp__label" [id]="uid + '-l'"
    >{{ label() }}@if (required()) {
      <span class="text-danger" aria-hidden="true"> *</span>
    }</span
  >
  <button
    type="button"
    class="ccp__pick"
    [attr.aria-labelledby]="uid + '-l ' + uid + '-v'"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    @if (color(); as c) {
      <span class="ccp__swatch" aria-hidden="true" [style.background]="c"></span>
    }
    @if (display(); as text) {
      <span class="ccp__value" [id]="uid + '-v'" [title]="text"
        >{{ text }}@if (path(); as p) {
          {{ ' ' }}<span class="ccp__path">{{ p }}</span>
        }</span
      >
    } @else {
      <span class="ccp__value ccp__placeholder" [id]="uid + '-v'">{{ placeholder() }}</span>
    }
    <app-icon [name]="open() ? 'up' : 'down'" [size]="18" />
  </button>
</div>
@if (open()) {
  <div class="ccp__tree">
    <app-cost-centre-tree
      [nodes]="nodes()"
      [selectedId]="value()"
      [allLabel]="allLabel()"
      [ariaLabel]="label()"
      [emptyLabel]="emptyLabel()"
      (picked)="pick($event)"
    />
  </div>
}
