<div class="rowgroup" role="list">
  @for (r of rows(); track r.key) {
    <app-list-item role="listitem" [title]="r.title" [link]="r.link" [linkQueryParams]="r.queryParams">
      <app-icon lead class="bil__icon" [name]="r.icon" [size]="20" />
      <span sub><app-meta-line>
        <span class="sr-only">{{ r.typeLabel }}:</span>
        @if (r.statusLabel) {
          <app-status-text [kind]="r.statusKind">{{ r.statusLabel }}</app-status-text>
        }
        @if (r.pathKey) {
          <span class="mono">{{ r.pathKey | simplifyPath }}</span>
        }
        @if (r.costCentre) {
          <span>{{ r.costCentre }}</span>
        }
        @if (r.date) {
          <span class="mono">{{ r.date }}</span>
        }
      </app-meta-line></span>
      <span trail class="mono bil__amount" [class.bil__amount--in]="r.income">{{ r.amount }}</span>
    </app-list-item>
  }
</div>
