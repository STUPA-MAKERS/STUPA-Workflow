<section class="home">
  <div class="home__head">
    <h1 class="home__heading">{{ 'home.heading' | t }}</h1>
    @if (welcome()) {
      <p class="home__welcome">{{ welcome() }}</p>
    }
  </div>

  <!-- Two ways in, side by side and weighted the same. A visitor is either an applicant
       or a Gremium member, and the page has no way to tell which, so it must not guess
       by making one of them the primary action. -->
  @if (loginError(); as reason) {
    <app-note class="home__loginError" kind="error" icon="lock" role="alert">
      <span>{{ reason | t }}</span>
    </app-note>
  }

  <div class="home__choices">
    <a routerLink="/apply" class="home__choice">
      <app-icon class="home__icon" name="form" [size]="24" />
      <span class="home__choice-title">{{ 'home.choice.apply.title' | t }}</span>
      <span class="home__choice-desc">{{ 'home.choice.apply.desc' | t }}</span>
      <span class="home__go" aria-hidden="true">
        {{ 'home.choice.go' | t }} <app-icon name="arrow" [size]="15" />
      </span>
    </a>

    <button type="button" class="home__choice" (click)="login()">
      <app-icon class="home__icon" name="user" [size]="24" />
      <span class="home__choice-title">{{ 'home.choice.login.title' | t }}</span>
      <span class="home__choice-desc">{{ 'home.choice.login.desc' | t }}</span>
      <span class="home__go" aria-hidden="true">
        {{ 'home.choice.go' | t }} <app-icon name="arrow" [size]="15" />
      </span>
    </button>
  </div>

  <p class="home__note">{{ 'home.statusNote' | t }}</p>
</section>
