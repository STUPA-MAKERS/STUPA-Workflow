<app-settings-screen
  [head]="{ title: 'admin.notifications.title' | t }"
  [groups]="groups()"
  [state]="screenState()"
  [save]="settings() ? { dirty: dirty(), busy: saving(), disabled: !valid() } : null"
  (save)="save()"
  (discard)="discard()"
>
  <ng-template screenGroup="reminder">
    @if (settings(); as s) {
      <div class="rowgroup rowgroup--settings">
        <app-switch
          class="ns__row"
          [checked]="s.taskReminderEnabled"
          (checkedChange)="patch({ taskReminderEnabled: $event })"
        >
          {{ 'admin.notifications.enabled' | t }}
        </app-switch>
      </div>
      <div class="ns__fields">
        <app-input
          type="number"
          [label]="'admin.notifications.afterDays' | t"
          [error]="afterDaysError()"
          [ngModel]="s.taskReminderAfterDays"
          (ngModelChange)="patch({ taskReminderAfterDays: toNumber($event) })"
          [disabled]="!s.taskReminderEnabled"
          name="afterDays"
        />
        <app-input
          type="number"
          [label]="'admin.notifications.repeatDays' | t"
          [error]="repeatDaysError()"
          [ngModel]="s.taskReminderRepeatDays"
          (ngModelChange)="patch({ taskReminderRepeatDays: toNumber($event) })"
          [disabled]="!s.taskReminderEnabled"
          name="repeatDays"
        />
      </div>
    }
  </ng-template>
</app-settings-screen>
