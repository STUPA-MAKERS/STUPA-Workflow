<section class="ns admin-page">
  <app-page-header [flush]="true" [title]="'admin.notifications.title' | t">
    <app-breadcrumbs crumbs />
  </app-page-header>

  <app-load-state [state]="loadState()" [lines]="4" [errorText]="'admin.notifications.error' | t" (retry)="load()">
    <ng-template #content>
      @if (settings(); as s) {
      <app-section class="ns__sec" [level]="2" [heading]="'admin.notifications.taskReminder' | t">
        <div class="rowgroup rowgroup--settings">
          <app-switch class="ns__row" [checked]="s.taskReminderEnabled" (checkedChange)="patch({ taskReminderEnabled: $event })">
            {{ 'admin.notifications.enabled' | t }}
          </app-switch>
        </div>
        <div class="ns__fields">
          <app-input
            type="number"
            [label]="'admin.notifications.afterDays' | t"
            [error]="afterDaysError()"
            [ngModel]="s.taskReminderAfterDays"
            (ngModelChange)="patch({ taskReminderAfterDays: toNumber($event) })"
            [disabled]="!s.taskReminderEnabled"
            name="afterDays"
          />
          <app-input
            type="number"
            [label]="'admin.notifications.repeatDays' | t"
            [error]="repeatDaysError()"
            [ngModel]="s.taskReminderRepeatDays"
            (ngModelChange)="patch({ taskReminderRepeatDays: toNumber($event) })"
            [disabled]="!s.taskReminderEnabled"
            name="repeatDays"
          />
        </div>
      </app-section>
      }
    </ng-template>
  </app-load-state>

  @if (settings() && dirty()) {
    <app-fab icon="check" [label]="'action.save' | t" [loading]="saving()" [disabled]="!valid()" (activate)="save()" />
  }
</section>
