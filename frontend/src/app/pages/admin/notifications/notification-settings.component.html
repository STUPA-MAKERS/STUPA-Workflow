<section class="ns">
  <app-page-header [flush]="true" [title]="'admin.notifications.title' | t" [subtitle]="'admin.notifications.intro' | t">
    @if (settings()) {
      <app-button actions variant="fill" [disabled]="!dirty() || !valid()" [loading]="saving()" (click)="save()">
        <app-icon name="check" [size]="18" /> {{ 'action.save' | t }}
      </app-button>
    }
  </app-page-header>

  @if (error()) {
    <app-note kind="error" icon="alert" role="alert">{{ $any(error()) | t }}</app-note>
  }

  @if (loading()) {
    <app-skeleton variant="lines" [count]="4" [label]="'common.loading' | t" />
  } @else if (settings(); as s) {
    <section class="ns__card" aria-labelledby="ns-reminder">
      <app-icon class="ns__icon" name="bell" [size]="20" />
      <div class="ns__body">
        <div class="ns__head">
          <div class="ns__text">
            <h2 class="ns__title" id="ns-reminder">{{ 'admin.notifications.taskReminder' | t }}</h2>
            <p class="ns__desc">{{ 'admin.notifications.taskReminderDesc' | t }}</p>
          </div>
          <app-switch [checked]="s.taskReminderEnabled" (checkedChange)="patch({ taskReminderEnabled: $event })">
            {{ 'admin.notifications.enabled' | t }}
          </app-switch>
        </div>
        <div class="ns__fields">
          <app-input
            type="number"
            [label]="'admin.notifications.afterDays' | t"
            [hint]="'admin.notifications.afterDaysHint' | t"
            [error]="afterDaysError()"
            [ngModel]="s.taskReminderAfterDays"
            (ngModelChange)="patch({ taskReminderAfterDays: toNumber($event) })"
            [disabled]="!s.taskReminderEnabled"
            name="afterDays"
          />
          <app-input
            type="number"
            [label]="'admin.notifications.repeatDays' | t"
            [hint]="'admin.notifications.repeatDaysHint' | t"
            [error]="repeatDaysError()"
            [ngModel]="s.taskReminderRepeatDays"
            (ngModelChange)="patch({ taskReminderRepeatDays: toNumber($event) })"
            [disabled]="!s.taskReminderEnabled"
            name="repeatDays"
          />
        </div>
      </div>
    </section>
  }
</section>
