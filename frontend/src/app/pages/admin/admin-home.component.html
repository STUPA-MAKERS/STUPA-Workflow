<section class="flex flex-col gap-7">
  <app-page-header [title]="'admin.home.title' | t" [subtitle]="'admin.home.subtitle' | t" />

  <div class="admin-home__grid">
    @for (tile of visibleTiles(); track tile.link) {
      <a class="admin-home__tile" [routerLink]="tile.link">
        <span class="admin-home__icon"><app-icon [name]="tile.icon" [size]="28" /></span>
        <span class="admin-home__text">
          <span class="text-lg font-semibold">{{ tile.title | t }}</span>
          <span class="text-muted text-sm">{{ tile.desc | t }}</span>
        </span>
      </a>
    }
  </div>
</section>
