<app-settings-screen
  [head]="{ title: 'admin.features.title' | t }"
  [groups]="groups()"
  [state]="screenState()"
  [save]="{ dirty: dirty(), busy: saving() }"
  (change)="set($any($event.key), $event.value)"
  (save)="save()"
  (discard)="discard()"
>
  <ng-template screenGroup="uses">
    <app-note class="ft__uses" kind="error" icon="alert" role="alert">
      <ul class="ft__useList">
        @for (use of uses(); track $index) {
          <li>{{ useText(use) }}</li>
        }
      </ul>
    </app-note>
  </ng-template>
</app-settings-screen>

<app-confirm-dialog
  [open]="confirming()"
  [title]="'admin.features.confirmTitle' | t"
  [body]="confirmBody()"
  [confirmLabel]="'admin.features.confirmAction' | t"
  (confirm)="confirmed()"
  (cancel)="confirming.set(false)"
/>
