<section class="ls admin-page">
  <app-page-header [flush]="true" [title]="'admin.loginSettings.title' | t" />

  <app-load-state
    [state]="form.state()"
    [forbiddenText]="'admin.loginSettings.forbidden' | t"
    [errorText]="'admin.loginSettings.loadError' | t"
  >
    <ng-template #content>
      <form class="ls__grid" (submit)="$event.preventDefault(); save()">
        <div class="ls__unitBox">
          <app-input
            type="number"
            [label]="'admin.loginSettings.web' | t"
            [error]="webError()"
            name="webSessionDays"
            [ngModel]="draft().web"
            (ngModelChange)="patch({ web: $event })"
          />
          <span class="ls__unit" aria-hidden="true">{{ 'admin.loginSettings.daysUnit' | t }}</span>
        </div>

        <div class="ls__unitBox">
          <app-input
            type="number"
            [label]="'admin.loginSettings.pwa' | t"
            [error]="pwaError()"
            name="pwaSessionDays"
            [ngModel]="draft().pwa"
            (ngModelChange)="patch({ pwa: $event })"
          />
          <span class="ls__unit" aria-hidden="true">{{ 'admin.loginSettings.daysUnit' | t }}</span>
        </div>
      </form>

      @if (saved()?.updatedAt; as at) {
        <p class="ls__meta">{{ 'admin.loginSettings.updatedAt' | t: { date: (at | ldate: 'medium') } }}</p>
      }

      @if (dirty()) {
        <app-fab icon="check" [label]="'action.save' | t" [loading]="saving()" [disabled]="!body()" (activate)="save()" />
      }
    </ng-template>
  </app-load-state>
</section>
