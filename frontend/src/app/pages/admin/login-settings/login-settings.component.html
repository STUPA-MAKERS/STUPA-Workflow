<app-settings-screen
  [head]="{ title: 'admin.loginSettings.title' | t }"
  [groups]="groups()"
  [state]="screenState()"
  [save]="{ dirty: dirty(), busy: saving(), disabled: !body() }"
  (save)="save()"
  (discard)="discard()"
>
  <ng-template screenGroup="sessions">
    <form class="ls__grid" (submit)="$event.preventDefault(); save()">
      <app-input
        type="number"
        [label]="'admin.loginSettings.web' | t"
        [error]="webError()"
        name="webSessionDays"
        [ngModel]="draft().web"
        (ngModelChange)="patch({ web: $event })"
        [suffix]="'admin.loginSettings.daysUnit' | t"
      />

      <app-input
        type="number"
        [label]="'admin.loginSettings.pwa' | t"
        [error]="pwaError()"
        name="pwaSessionDays"
        [ngModel]="draft().pwa"
        (ngModelChange)="patch({ pwa: $event })"
        [suffix]="'admin.loginSettings.daysUnit' | t"
      />
    </form>
  </ng-template>
</app-settings-screen>
