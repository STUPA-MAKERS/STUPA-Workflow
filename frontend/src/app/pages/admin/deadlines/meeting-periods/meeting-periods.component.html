@if (form.state() !== 'forbidden') {
  <app-section class="gs" [level]="2" [heading]="'admin.meetingPeriods.title' | t">

    <app-load-state [state]="form.state()" [lines]="4" [errorText]="'admin.guest.loadError' | t" (retry)="form.reload()">
      <ng-template #content>
        <form class="gs__grid" (submit)="$event.preventDefault(); save()">
          @for (field of fields; track field.key) {
            <div class="gs__field">
              @if (field.key === 'termStartMonth') {
                <app-select
                  [label]="field.label | t"
                  [options]="months()"
                  [name]="field.key"
                  [ngModel]="draft()[field.key]"
                  (ngModelChange)="patch(field.key, $event)"
                />
              } @else {
                <app-input
                  type="number"
                  [label]="field.label | t"
                  [error]="errors()[field.key]"
                  [name]="field.key"
                  [ngModel]="draft()[field.key]"
                  (ngModelChange)="patch(field.key, $event)"
                  [suffix]="field.unit ? (field.unit | t) : ''"
                />
              }
            </div>
          }
        </form>
      </ng-template>
    </app-load-state>
  </app-section>
}
