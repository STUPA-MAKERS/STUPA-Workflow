@if (form.state() !== 'forbidden') {
  <section class="gs" aria-labelledby="mw-title">
    <app-section-header class="gs__head" headingId="mw-title" [heading]="'admin.meetingWindow.title' | t" />

    <app-load-state [state]="form.state()" [lines]="2" [errorText]="'admin.guest.loadError' | t">
      <ng-template #content>
        <form class="gs__grid" (submit)="$event.preventDefault(); save()">
          <div class="gs__field">
            <app-input
              type="number"
              [label]="'admin.meetingWindow.openLead' | t"
              [error]="openError()"
              name="openLeadMinutes"
              [ngModel]="draft().open"
              (ngModelChange)="patch({ open: $event })"
              [suffix]="'admin.meetingWindow.unit' | t"
            />
          </div>

          <div class="gs__field">
            <app-input
              type="number"
              [label]="'admin.meetingWindow.confirmLead' | t"
              [error]="confirmError()"
              name="confirmLeadMinutes"
              [ngModel]="draft().confirm"
              (ngModelChange)="patch({ confirm: $event })"
              [suffix]="'admin.meetingWindow.unit' | t"
            />
          </div>
        </form>
      </ng-template>
    </app-load-state>
  </section>
}
