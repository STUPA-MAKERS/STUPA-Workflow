@if (loadState() !== 'forbidden') {
  <section class="gs" aria-labelledby="gs-title">
    <header class="gs__head">
      <div class="gs__text">
        <h2 class="section-title" id="gs-title">{{ 'admin.guest.title' | t }}</h2>
      </div>
    </header>

    @if (loading()) {
      <app-skeleton variant="lines" [count]="2" [label]="'common.loading' | t" />
    } @else if (loadState() === 'error') {
      <app-note kind="error" icon="alert" role="alert">{{ 'admin.guest.loadError' | t }}</app-note>
    } @else {
      <form class="gs__grid" (submit)="$event.preventDefault(); save()">
        <div class="gs__field">
          <app-input
            type="number"
            [label]="'admin.guest.hours' | t"
            [error]="hoursError()"
            name="confirmTtlHours"
            [ngModel]="draft().hours"
            (ngModelChange)="patch({ hours: $event })"
            [suffix]="'admin.guest.hoursUnit' | t"
          />
        </div>

        <div class="gs__field">
          <div class="gs__link" [class.gs__link--days]="draft().mode === 'days'">
            <app-select
              [label]="'admin.guest.link' | t"
              [options]="modeOptions()"
              name="linkMode"
              [ngModel]="draft().mode"
              (ngModelChange)="setMode($event)"
            />
            @if (draft().mode === 'days') {
              <app-input
                type="number"
                [label]="'admin.guest.days' | t"
                [error]="daysError()"
                name="linkTtlDays"
                [ngModel]="draft().days"
                (ngModelChange)="patch({ days: $event })"
                [suffix]="'admin.guest.daysUnit' | t"
              />
            }
          </div>
        </div>
      </form>
    }
  </section>
}
