@if (form.state() !== 'forbidden') {
  <section class="gs" aria-labelledby="gs-title">
    <app-section-header class="gs__head" headingId="gs-title" [heading]="'admin.guest.title' | t" />

    <app-load-state [state]="form.state()" [lines]="2" [errorText]="'admin.guest.loadError' | t">
      <ng-template #content>
        <form class="gs__grid" (submit)="$event.preventDefault(); save()">
          <div class="gs__field">
            <div class="gs__unitBox">
              <app-input
                type="number"
                [label]="'admin.guest.hours' | t"
                [error]="hoursError()"
                name="confirmTtlHours"
                [ngModel]="draft().hours"
                (ngModelChange)="patch({ hours: $event })"
              />
              <span class="gs__unit" aria-hidden="true">{{ 'admin.guest.hoursUnit' | t }}</span>
            </div>
          </div>

          <div class="gs__field">
            <div class="gs__link" [class.gs__link--days]="draft().mode === 'days'">
              <app-select
                [label]="'admin.guest.link' | t"
                [options]="modeOptions()"
                name="linkMode"
                [ngModel]="draft().mode"
                (ngModelChange)="setMode($event)"
              />
              @if (draft().mode === 'days') {
                <div class="gs__unitBox">
                  <app-input
                    type="number"
                    [label]="'admin.guest.days' | t"
                    [error]="daysError()"
                    name="linkTtlDays"
                    [ngModel]="draft().days"
                    (ngModelChange)="patch({ days: $event })"
                  />
                  <span class="gs__unit" aria-hidden="true">{{ 'admin.guest.daysUnit' | t }}</span>
                </div>
              }
            </div>
          </div>
        </form>
      </ng-template>
    </app-load-state>
  </section>
}
