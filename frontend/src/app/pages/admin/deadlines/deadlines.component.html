<section class="dl admin-page">
  <app-page-header [flush]="true" [title]="'admin.deadlines.title' | t">
    <app-breadcrumbs crumbs />
  </app-page-header>

  <app-meeting-window-settings />

  <app-guest-settings />

  @if (settingsDirty()) {
    <app-fab
      icon="check"
      [label]="'action.save' | t"
      [loading]="settingsSaving()"
      [disabled]="!settingsValid()"
      (activate)="saveSettings()"
    />
  }
</section>
