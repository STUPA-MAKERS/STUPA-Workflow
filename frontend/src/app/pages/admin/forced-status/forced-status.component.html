<app-records-screen
  [head]="{ title: 'admin.forced.title' | t }"
  [rows]="rows()"
  [filtersLabel]="'admin.forced.filters' | t"
>
  <ng-template screenFilters>
    <app-filter-select
      [label]="'admin.forced.filter.reason' | t"
      [text]="reasonText()"
      [active]="!!reason()"
      [options]="reasonOptions()"
      [value]="reason()"
      (valueChange)="setReason($event)"
    />
    <app-filter-select
      [label]="'admin.forced.filter.path' | t"
      [text]="pathText()"
      [active]="!!path()"
      [options]="pathOptions()"
      [value]="path()"
      (valueChange)="setPath($event)"
    />
    <app-range-chip
      kind="date"
      [label]="'admin.forced.period' | t"
      [from]="from()"
      [to]="to()"
      (applied)="setRange($event)"
    />
  </ng-template>
</app-records-screen>
