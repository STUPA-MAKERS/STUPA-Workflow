<div
  class="af"
  [class.af--split]="split()"
  [class.af--home]="home()"
  [class.af--pane]="fullPane()"
  [class.af--account]="frame() === 'account'"
>
  @if (showNav()) {
    <nav class="ld-pane af__nav" [attr.aria-label]="mode().navLabel | t">
      <app-page-header
        [pane]="true"
        [title]="mode().title | t"
        [titleTag]="home() ? 'h1' : 'p'"
      />
      @if (mode().search) {
        <app-sticky-bar class="ld-pane__filters af__search">
          <app-search-pill
            [size]="split() ? 'lg' : 'md'"
            [clearable]="true"
            [placeholder]="'admin.frame.search' | t"
            [value]="query()"
            (valueChange)="query.set($event)"
          />
        </app-sticky-bar>
      }

      <div #navBody class="af__navBody" appScrollFade="y">
        @if (mode().health) {
          <app-admin-health [class.af__hidden]="!!query()" />
        }

        @for (g of groups(); track g.key) {
          <section class="af__group" [attr.aria-labelledby]="g.title ? 'af-group-' + g.key : null">
            @if (g.title) {
              <h2 class="sec af__groupTitle" [id]="'af-group-' + g.key">{{ g.title | t }}</h2>
            }
            <ul class="af__list">
              @for (p of g.pages; track p.link) {
                <li>
                  <a
                    class="af__item"
                    [routerLink]="linkOf(p)"
                    routerLinkActive="af__item--on"
                    ariaCurrentWhenActive="page"
                  >
                    <app-icon class="af__icon" [name]="p.icon" [size]="20" />
                    <span class="af__itemText">
                      <span class="af__itemTitle ell" [title]="p.title | t">{{ p.title | t }}</span>
                      @if (navOnly()) {
                        <span class="af__itemDesc">{{ p.desc | t }}</span>
                      }
                    </span>
                  </a>
                </li>
              }
            </ul>
          </section>
        } @empty {
          <app-empty-state role="status" rows="3" [heading]="'admin.frame.noMatch' | t" />
        }
      </div>
    </nav>
  }

  <div
    class="af__page"
    [class.af__hidden]="navOnly()"
    [class.af__page--swiping]="swiping()"
    appSwipeBack
    [appSwipeBackOff]="!swipeBack()"
    (appSwipeBackStart)="swiping.set(true)"
    (appSwipeBack)="goBack()"
    (appSwipeBackEnd)="swiping.set(false)"
  >
    <div #page class="af__pageBody" [class.ld-under-bar]="showBar()" appScrollFade="y">
      @if (showBar()) {
        <app-list-detail-bar [title]="nav.title()" (back)="goBack()" />
      }
      <router-outlet />
    </div>
  </div>
</div>
