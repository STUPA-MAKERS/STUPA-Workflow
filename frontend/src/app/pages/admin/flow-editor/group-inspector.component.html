<div class="ins__head">
  <h2 class="cap ins__title">{{ 'admin.flow.group.inspector' | t }}</h2>
  <app-button variant="outlined" size="sm" (click)="dissolve.emit()">{{ 'admin.flow.group.dissolve' | t }}</app-button>
</div>
<app-input [label]="'admin.flow.group.name' | t" [ngModel]="group().name" (ngModelChange)="nameChange.emit($event)" />
<app-flow-color [value]="group().color" (changed)="colorChange.emit($event)" />
<p class="ins__hint">
  {{ group().stateKeys.length }} {{ 'admin.flow.group.members' | t }}@if (group().groupIds?.length) {, {{ group().groupIds?.length }} {{ 'admin.flow.group.subgroups' | t }}}
</p>
<p class="ins__hint">{{ 'admin.flow.group.dissolveHint' | t }}</p>
