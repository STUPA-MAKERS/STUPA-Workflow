<div class="ins__head">
  <h2 class="cap ins__title">{{ 'admin.flow.transitionInspector' | t }}</h2>
  <app-button variant="danger" size="sm" (click)="remove.emit()">
    <app-icon name="trash" /> {{ 'admin.flow.removeTransition' | t }}
  </app-button>
</div>

<div class="ins__pair">
  <app-select
    [label]="'admin.flow.from' | t"
    [options]="stateOptions()"
    [ngModel]="transition().from"
    (ngModelChange)="fromChange.emit($event)"
  />
  <app-select
    [label]="'admin.flow.to' | t"
    [options]="stateOptions()"
    [ngModel]="transition().to"
    (ngModelChange)="toChange.emit($event)"
  />
</div>
<div class="ins__pair">
  <app-i18n-input [value]="transition().label ?? {}" (valueChange)="labelChange.emit($event)" />
</div>

<app-flow-color [value]="transition().color" (changed)="colorChange.emit($event)" />

<div class="ins__switches">
  <app-switch
    [ngModel]="!!transition().automatic"
    (ngModelChange)="automaticChange.emit($event)"
  >{{ 'admin.flow.automatic' | t }}</app-switch>
  @if (!transition().automatic) {
    <app-switch
      [ngModel]="transition().requiresAction !== false"
      (ngModelChange)="requiresActionChange.emit($event)"
    >{{ 'admin.flow.requiresAction' | t }}</app-switch>
  }
</div>

@if (branchOptions().length) {
  <app-select
    [label]="'admin.flow.branch' | t"
    [placeholder]="'admin.flow.branchNone' | t"
    [options]="branchOptions()"
    [ngModel]="transition().branch ?? ''"
    (ngModelChange)="branchChange.emit($event)"
  />
}
