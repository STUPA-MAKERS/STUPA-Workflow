<app-records-screen
  class="gmm"
  [head]="{ title: ('admin.gremien.membersOf' | t) + ': ' + (gremium()?.name ?? '…') }"
  [rows]="rows()"
  variant="records"
  [listLabel]="'admin.gremien.members' | t"
  [keepOnError]="members().length > 0"
>
  <ng-template screenSearch>
    <div role="search">
      <app-search-pill
        size="md"
        [clearable]="true"
        [placeholder]="'admin.gremien.membersSearch' | t"
        [label]="'admin.gremien.membersSearch' | t"
        [results]="hits()"
        [value]="search.text()"
        (valueChange)="search.set($event)"
      />
    </div>
  </ng-template>
  <ng-template screenRecord let-row>
    @let m = memberOf(row.id);
    <li class="gmm__row">
      <app-avatar size="sm" [name]="m.name" [principalId]="m.id" [decorative]="true" />
      <span class="gmm__name rowgroup__title ell" [title]="m.name">{{ m.name }}</span>
      <span class="gmm__mail mono">{{ m.email ?? '—' }}</span>
      <span class="gmm__role">{{ m.role | capitalize }}</span>
    </li>
  </ng-template>
</app-records-screen>
