<section class="notif">
  <app-page-header
    [title]="'account.notifications.title' | t"
    [subtitle]="'account.notifications.intro' | t"
  />

  @if (error()) {
    <p class="text-danger m-0" role="alert">{{ $any(error()) | t }}</p>
  }

  <section class="border border-solid border-line rounded-lg py-4 px-5 bg-surface">
    @if (loading()) {
      <app-skeleton variant="rows" [count]="4" [label]="'admin.audit.loading' | t" />
    } @else {
      <ul class="notif__list">
        @for (p of prefs(); track p.kind) {
          <li class="notif__item">
            <app-checkbox
              [ngModel]="p.enabled"
              (ngModelChange)="toggle(p.kind, $event)"
              [hint]="kindHint(p.kind)"
            >
              {{ kindLabel(p.kind) }}
            </app-checkbox>
          </li>
        }
      </ul>
    }
  </section>
</section>
