<div class="none">
  @switch (state()) {
    @case ('empty') {
      <app-empty-state plain icon="check"
        fill
        [heading]="'tasks.empty' | t"
        [body]="'tasks.emptyBody' | t"
      />
    }
    @case ('pick') {
      <app-empty-state plain icon="tasks" fill [heading]="'tasks.none' | t" />
    }
  }
</div>
