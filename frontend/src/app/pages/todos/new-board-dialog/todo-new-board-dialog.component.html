<app-dialog
  [open]="open()"
  size="md"
  [heading]="'todos.newBoard.title' | t"
  [closeLabel]="'action.close' | t"
  (closed)="open.set(false)"
  [actions]="[
    { key: 'open', label: ('action.cancel' | t) },
    {
      key: 'submit',
      label: ('todos.board.create' | t),
      kind: 'main',
      disabled: !valid(),
      busy: saving(),
    },
  ]"
  (action)="$event.key === 'open' ? open.set(false) : $event.key === 'submit' ? submit() : null"
>
  <ng-template dialogBody>
    <form class="nb" (submit)="$event.preventDefault(); submit()">
      <app-input
        name="boardName"
        [id]="'nb-name'"
        [label]="'todos.settings.name' | t"
        [required]="true"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
      />
      <div class="nb__field" role="group" aria-labelledby="nb-members">
        <span class="nb__cap" id="nb-members">{{ 'todos.entries.title' | t }}</span>
        @if (open()) {
          <app-todo-board-entries
            [entries]="entries()"
            (added)="add($event)"
            (roleChanged)="setRole($event)"
            (removed)="remove($event)"
          />
        }
      </div>
      <button type="submit" hidden></button>
    </form>
  </ng-template>
</app-dialog>
