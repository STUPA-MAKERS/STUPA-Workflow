<div class="bp" (keydown)="onKey($event)">
  <button
    #chip
    type="button"
    class="bp__chip"
    aria-haspopup="true"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="open() && !phone() ? listId : null"
    [title]="chipText()"
    (click)="toggle()"
  >
    <app-icon [name]="chipIcon()" [size]="16" />
    <span class="ell">{{ chipText() }}</span>
    <app-icon name="down" [size]="15" />
  </button>

  <ng-template #rows>
    @for (section of sections(); track section.kind) {
      <p class="cap bp__cap">{{ section.label | t }}</p>
      @for (board of section.boards; track board.id) {
        <button
          type="button"
          class="bp__row"
          [attr.aria-current]="board.id === current() ? 'true' : null"
          (click)="pick(board)"
        >
          <app-icon class="bp__icon" [name]="icon(board.kind)" [size]="18" />
          <span class="bp__text">
            <span class="bp__name">{{ board.name }}</span>
            <span class="bp__sub">{{ sub(board) }}</span>
          </span>
          @if (board.id === current()) {
            <app-icon class="bp__check" name="check" [size]="18" />
          }
        </button>
      }
    }
  </ng-template>

  @if (open() && !phone()) {
    <div class="bp__pop" role="group" [id]="listId" [attr.aria-label]="'todos.board.pick' | t">
      <ng-container *ngTemplateOutlet="rows" />
    </div>
  }
  @if (phone()) {
    <app-side-sheet side="bottom" [heading]="'todos.board.pick' | t" [open]="open()" (openChange)="open.set($event)">
      <div class="bp__sheet">
        <ng-container *ngTemplateOutlet="rows" />
      </div>
    </app-side-sheet>
  }
</div>
