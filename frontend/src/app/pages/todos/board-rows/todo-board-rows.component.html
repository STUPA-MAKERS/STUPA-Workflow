<app-todo-board-rows-view
  [rows]="rows()"
  [today]="today()"
  [phone]="phone()"
  [extraDrops]="extraDrops()"
  [lead]="lead()"
  [boardLink]="boardLink"
  (openCard)="openCard.emit($event)"
  (menu)="menu.emit($event)"
  (dropIn)="dropIn.emit($event)"
  (rowMove)="move($event.boardId, $event.cardId, $event.move)"
  (rowTransfer)="transfer($event.fromId, $event.toId, $event.tile, $event.move)"
  (drops)="drops.emit($event)"
/>
