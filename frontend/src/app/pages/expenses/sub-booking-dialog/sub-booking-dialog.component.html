@let s = sub();
<app-dialog
  [open]="!!s.subParent()"
  [heading]="'expenses.sub.addTitle' | t"
  [subtitle]="
    s.subParent() ? ('expenses.sub.inherits' | t: { parent: s.subParent()!.description }) : ''
  "
  [closeLabel]="'action.close' | t"
  (closed)="s.closeCreateSub()"
  [actions]="[
    { key: 'closeCreateSub', label: ('action.cancel' | t) },
    {
      key: 'createSub',
      label: ('expenses.sub.add' | t),
      kind: 'main',
      disabled: !s.canSubmitSub(),
      busy: saving(),
    },
  ]"
  (action)="
    $event.key === 'closeCreateSub'
      ? s.closeCreateSub()
      : $event.key === 'createSub'
        ? s.createSub()
        : null
  "
>
  <ng-template dialogBody>
    @if (s.subParent()) {
      <form class="sd-form" (submit)="s.createSub($event)">
        <app-input
          name="subdesc"
          [label]="'expenses.field.description' | t"
          [required]="true"
          [placeholder]="'expenses.field.descriptionPlaceholder' | t"
          [ngModel]="s.subDescription()"
          (ngModelChange)="s.subDescription.set($event)"
        />
        <app-currency-input
          name="subamount"
          [label]="'expenses.field.amount' | t"
          [required]="true"
          [ngModel]="s.subAmount()"
          (ngModelChange)="s.subAmount.set($event)"
        />
        <div class="sd-form__grid">
          <app-datepicker
            name="subpay"
            [label]="'expenses.field.paymentDate' | t"
            [ngModel]="s.subPaymentDate()"
            (ngModelChange)="s.subPaymentDate.set($event)"
          />
          <app-input
            name="subcorr"
            [label]="'expenses.field.correspondent' | t"
            [ngModel]="s.subCorrespondent()"
            (ngModelChange)="s.subCorrespondent.set($event)"
          />
        </div>
      </form>
    }
  </ng-template>
</app-dialog>
