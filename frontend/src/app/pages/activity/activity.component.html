<div class="act">
  <section class="ld-pane" aria-labelledby="act-title">
    <app-page-header [pane]="true" titleId="act-title" [title]="'activity.title' | t">
      @if (!phone()) {
        <ng-container ngProjectAs="[actions]">
          <app-button-group>
            <a appButton routerLink="/apply">
              <app-icon name="plus" [size]="16" />
              {{ 'fab.application' | t }}
            </a>
          </app-button-group>
        </ng-container>
      }
    </app-page-header>

    <app-sticky-bar class="ld-pane__filters">
      <div class="act__chips" role="group" [attr.aria-label]="'activity.filter.group' | t">
        <app-filter-select
          class="act__chip"
          icon="funnel"
          [label]="'activity.filter.kind' | t"
          [multiple]="true"
          [options]="kindOptions()"
          [values]="kinds()"
          (valuesChange)="setKinds($event)"
          [active]="kinds().length > 0"
        />
        <app-filter-select
          class="act__chip"
          icon="user"
          [label]="'activity.filter.who' | t"
          [options]="whoOptions()"
          [value]="own() ? 'own' : ''"
          (valueChange)="setWho($event)"
          [text]="(own() ? 'activity.filter.own' : 'activity.filter.others') | t"
          [active]="own()"
        />
      </div>
    </app-sticky-bar>

    <div class="act__scroll" appScrollFade="y" [attr.aria-busy]="loading() || null">
      <app-live-cards class="act__live" />
      @if (error()) {
        <app-load-error [message]="'activity.loadError' | t" (retry)="retry()" />
      }
      <app-activity-view
        [entries]="view()"
        [loadingMore]="loadingMore()"
        [emptyBody]="filtered() ? null : ('activity.emptyBody' | t)"
        (more)="loadMore()"
      />
    </div>
  </section>
</div>

@if (phone()) {
  <app-fab [label]="'fab.application' | t" link="/apply" />
}
