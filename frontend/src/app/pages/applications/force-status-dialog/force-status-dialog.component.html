<app-dialog
  [open]="open()"
  [title]="'applications.detail.forceStatusTitle' | t"
  [closeLabel]="'action.close' | t"
  (closed)="close()"
>
  <app-select
    [label]="'applications.detail.forceStatusField' | t"
    [placeholder]="'applications.detail.forceStatusPlaceholder' | t"
    [options]="options()"
    [ngModel]="choice()"
    (ngModelChange)="choice.set($event)"
  />
  @if (needsAmount()) {
    <app-decision-editor
      class="fsd__gap"
      idPrefix="fsd"
      [required]="true"
      [requested]="requested()"
      [currency]="currency()"
      [draft]="draft()"
      (draftChange)="draft.set($event)"
    />
  }
  <app-select
    class="fsd__gap"
    [label]="'applications.detail.forceStatusReason' | t"
    [placeholder]="'applications.detail.forceStatusReasonPick' | t"
    [options]="reasonOptions()"
    [ngModel]="reason()"
    (ngModelChange)="reason.set($event)"
  />
  <app-textarea
    class="fsd__gap"
    [label]="(noteRequired() ? 'applications.detail.forceStatusNoteRequired' : 'applications.detail.forceStatusNote') | t"
    [invalid]="noteRequired() && note().length > 0 && noteMissing()"
  >
    <textarea
      rows="3"
      name="forceNote"
      [attr.aria-required]="noteRequired()"
      [placeholder]="'applications.detail.forceStatusReasonPlaceholder' | t"
      [ngModel]="note()"
      (ngModelChange)="note.set($event)"
    ></textarea>
  </app-textarea>
  @if (noteRequired() && note().length > 0 && noteMissing()) {
    <p class="fsd__error" role="alert">{{ 'applications.detail.forceStatusNoteShort' | t }}</p>
  }
  <app-button dialog-footer variant="text" (click)="close()">{{ 'action.cancel' | t }}</app-button>
  <app-button
    dialog-footer
    variant="danger"
    [loading]="saving()"
    [disabled]="!ready()"
    (click)="submit()"
  >{{ 'applications.detail.forceStatusConfirm' | t }}</app-button>
</app-dialog>
