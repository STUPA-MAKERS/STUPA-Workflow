<app-dialog
  [open]="open()"
  [heading]="'amendAmount.title' | t"
  [closeLabel]="'action.close' | t"
  (closed)="close()"
  [actions]="[
    { key: 'close', label: ('action.cancel' | t) },
    {
      key: 'submit',
      label: ('amendAmount.confirm' | t),
      kind: 'main',
      disabled: !ready(),
      busy: saving(),
    },
  ]"
  (action)="$event.key === 'close' ? close() : $event.key === 'submit' ? submit() : null"
>
  <ng-template dialogBody>
    <form class="aad" (submit)="$event.preventDefault(); submit()">
      <app-currency-input
        name="aadAmount"
        [label]="'amendAmount.amount' | t"
        [required]="true"
        [error]="amountError()"
        [ngModel]="amount()"
        (ngModelChange)="amount.set($event ?? '')"
      />
      @if (aboveRequested()) {
        <app-note kind="warn" icon="alert" role="status">{{
          'amendAmount.aboveRequested' | t
        }}</app-note>
      }
      <div class="aad__note">
        <app-textarea [label]="'amendAmount.reason' | t" [invalid]="reasonShort()">
          <textarea
            rows="3"
            name="aadReason"
            aria-required="true"
            [attr.maxlength]="maxReason"
            [placeholder]="'amendAmount.reasonPlaceholder' | t"
            [ngModel]="reason()"
            (ngModelChange)="reason.set($event)"
          ></textarea>
        </app-textarea>
        @if (reasonShort()) {
          <app-error-text [inset]="true">{{ 'amendAmount.error.reasonShort' | t }}</app-error-text>
        }
      </div>
      <div class="aad__pair">
        <app-datepicker
          name="aadDate"
          [label]="'amendAmount.date' | t"
          [required]="true"
          [max]="today()"
          [error]="dateError()"
          [ngModel]="date()"
          (ngModelChange)="date.set($event ?? '')"
        />
        <app-select
          name="aadGremium"
          [label]="'outsideDecision.gremium' | t"
          [placeholder]="'outsideDecision.gremiumPick' | t"
          [options]="gremiumOptions()"
          [ngModel]="gremium()"
          (ngModelChange)="gremium.set($event ?? '')"
        />
      </div>
      @if (refusal()) {
        <app-error-text [inset]="true">{{ refusal() }}</app-error-text>
      }
      <button type="submit" hidden></button>
    </form>
  </ng-template>
</app-dialog>
