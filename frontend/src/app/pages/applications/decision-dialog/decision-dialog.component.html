<app-dialog
  [open]="open()"
  [heading]="confirmLabel()"
  [closeLabel]="'action.close' | t"
  (closed)="close()"
  [actions]="[
    { key: 'close', label: ('action.cancel' | t) },
    { key: 'submit', label: confirmLabel(), kind: 'main', disabled: invalid(), busy: saving() },
  ]"
  (action)="$event.key === 'close' ? close() : $event.key === 'submit' ? submit() : null"
>
  <ng-template dialogBody>
    <form class="ddg" (submit)="$event.preventDefault(); submit()">
      <span class="ddg__cap cap">{{ 'decision.section' | t }}</span>
      <app-decision-editor
        idPrefix="ddg"
        [requested]="requested()"
        [currency]="currency()"
        [required]="required()"
        [(draft)]="draft"
      />
      @if (refusal()) {
        <app-error-text>{{ refusal() }}</app-error-text>
      }
      <button type="submit" hidden></button>
    </form>
  </ng-template>
</app-dialog>
