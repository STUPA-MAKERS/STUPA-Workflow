<app-data-table
  [columns]="columns()"
  [rows]="rows()"
  [rowKey]="rowId"
  [sort]="tableSort()"
  (sortChange)="onSortChange($event)"
  [loading]="loading()"
  [loadingText]="'common.loading' | t"
  [emptyText]="emptyText()"
>
  <ng-template appCell="title" let-row>
    <!-- The title is clipped to one line, so the full text has to stay reachable. -->
    <a
      class="atbl__rowLink"
      [routerLink]="['/applications', $any(row).id]"
      [title]="$any(row).title"
    >
      <span class="atbl__rowTitle">{{ $any(row).title }}</span>
      <span class="atbl__rowHint">{{ 'applications.list.open' | t }}</span>
    </a>
  </ng-template>

  <ng-template appCell="typeLabel" let-row>{{ $any(row).typeLabel || '—' }}</ng-template>

  <ng-template appCell="stateLabel" let-row>
    @if ($any(row).stateLabel) {
      <app-badge [color]="$any(row).stateColor">{{ $any(row).stateLabel }}</app-badge>
    } @else {
      —
    }
  </ng-template>

  <ng-template appCell="amount" let-row>
    {{ money($any(row).amount, $any(row).currency) }}
  </ng-template>

  <ng-template appCell="createdAt" let-row>
    @if ($any(row).createdAt; as created) {
      <time [attr.datetime]="created">{{ created | ldate: 'mediumDate' }}</time>
    } @else {
      —
    }
  </ng-template>
</app-data-table>
