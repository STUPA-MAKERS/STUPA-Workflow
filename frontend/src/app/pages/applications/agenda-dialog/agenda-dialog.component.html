<app-dialog
  [open]="open()"
  [heading]="'applications.agenda.title' | t"
  [closeLabel]="'action.close' | t"
  (closed)="close()"
  [actions]="[
    { key: 'close', label: ('action.cancel' | t) },
    {
      key: 'submit',
      label: confirmLabel(),
      icon: 'cal',
      kind: 'main',
      disabled: !canConfirm(),
      busy: saving(),
    },
  ]"
  (action)="$event.key === 'close' ? close() : $event.key === 'submit' ? submit() : null"
>
  <ng-template dialogBody>
    <form class="agd" (submit)="$event.preventDefault(); submit()">
      <div class="agd__group">
        <div class="agd__cap">
          <span class="cap" id="agd-meetings">{{ 'applications.agenda.pick' | t }}</span>
          @if (gremiumName()) {
            <span class="agd__gremium ell" [title]="gremiumName()">{{ gremiumName() }}</span>
          }
        </div>
        @if (loading()) {
          <app-skeleton variant="rows" [count]="2" [label]="'common.loading' | t" />
        } @else if (choices().length) {
          <div class="agd__list" appScrollFade="y" role="radiogroup" aria-labelledby="agd-meetings">
            @for (c of choices(); track c.meeting.id) {
              <label class="agd__row" [class.agd__row--on]="pick() === c.meeting.id">
                <input
                  class="agd__radio"
                  type="radio"
                  name="agd-meeting"
                  [value]="c.meeting.id"
                  [checked]="pick() === c.meeting.id"
                  (change)="pick.set(c.meeting.id)"
                />
                <app-date-block [date]="c.meeting.date" />
                <span class="agd__text">
                  <span class="agd__title ell" [title]="c.meeting.title">{{
                    c.meeting.title
                  }}</span>
                  @if (c.sub) {
                    <span class="agd__sub">{{ c.sub }}</span>
                  }
                </span>
                @if (suggestedId() === c.meeting.id) {
                  <span class="agd__suggest">{{ 'applications.agenda.suggested' | t }}</span>
                }
              </label>
            }
          </div>
        } @else {
          <app-empty-state
            icon="list"
            shape="date"
            rows="3"
            [heading]="'applications.agenda.none' | t"
          />
        }
        @if (refusal(); as key) {
          <app-error-text class="agd__refusal">{{ key | t }}</app-error-text>
        }
      </div>

      @if (!noMeeting()) {
        <app-switch [id]="'agd-np'" [checked]="nonPublic()" (checkedChange)="nonPublic.set($event)"
          ><span class="agd__switchLabel">{{
            'meetings.agenda.nonPublicLabel' | t
          }}</span></app-switch
        >
      }

      <label class="agd__note">
        <span class="agd__noteLabel">{{ 'applications.agenda.note' | t }}</span>
        <textarea
          class="agd__noteInput"
          rows="2"
          name="agd-note"
          [placeholder]="'applications.agenda.notePlaceholder' | t"
          [ngModel]="note()"
          (ngModelChange)="note.set($event)"
        ></textarea>
      </label>
      <button type="submit" hidden></button>
    </form>
  </ng-template>
</app-dialog>
