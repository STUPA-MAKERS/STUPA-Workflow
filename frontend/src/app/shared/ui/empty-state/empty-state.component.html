<div class="es">
  <div class="es__ghosts" aria-hidden="true">
    @for (g of ghosts(); track $index) {
      <div class="es__ghost">
        <span class="es__ghostMark"></span>
        <span class="es__ghostText">
          <span class="es__ghostBar" [style.width.%]="g.title"></span>
          <span class="es__ghostBar es__ghostBar--sub" [style.width.%]="g.sub"></span>
        </span>
      </div>
    }
  </div>
  <div class="es__msg">
    @if (code(); as c) {
      <p class="es__code">{{ c }}</p>
    }
    @if (fill()) {
      <h2 class="es__heading">{{ heading() }}</h2>
    } @else {
      <p class="es__heading">{{ heading() }}</p>
    }
    @if (body(); as text) {
      <p class="es__body">{{ text }}</p>
    }
    <!-- Projected, so the caller decides whether there is a way forward at all. -->
    <div class="es__action">
      <ng-content />
    </div>
  </div>
</div>
