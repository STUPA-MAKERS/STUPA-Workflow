<button
  type="button"
  class="chip rc__chip"
  [class.on]="active()"
  aria-haspopup="dialog"
  [attr.aria-expanded]="open()"
  [title]="chipText()"
  (click)="openSheet()"
>
  @if (active()) {
    <app-icon name="check" [size]="15" />
  }
  <span class="ell">{{ chipText() }}</span>
  @if (!active()) {
    <app-icon class="rc__chev" name="down" [size]="15" />
  }
</button>

<app-side-sheet class="rc__sheet" [side]="side()" [heading]="label()" [(open)]="open">
  <div class="rc__form">
    <div class="rc__fields" role="group" [attr.aria-label]="label()">
      @if (kind() === 'amount') {
        <app-currency-input
          name="rangeFrom"
          [label]="'ui.range.from' | t"
          [ngModel]="draftFrom()"
          (ngModelChange)="draftFrom.set($event ?? '')"
        />
        <app-currency-input
          name="rangeTo"
          [label]="'ui.range.to' | t"
          [ngModel]="draftTo()"
          (ngModelChange)="draftTo.set($event ?? '')"
        />
      } @else {
        <app-datepicker
          name="rangeFrom"
          [label]="'ui.range.from' | t"
          [ngModel]="draftFrom()"
          (ngModelChange)="draftFrom.set($event ?? '')"
        />
        <app-datepicker
          name="rangeTo"
          [label]="'ui.range.to' | t"
          [ngModel]="draftTo()"
          (ngModelChange)="draftTo.set($event ?? '')"
        />
      }
    </div>
    @if (!draftValid()) {
      <p class="rc__error" role="alert">{{ 'ui.range.invalid' | t }}</p>
    }
    <div class="rc__actions">
      <app-button variant="text" size="sm" (click)="reset()">{{ 'ui.range.reset' | t }}</app-button>
      <app-button variant="fill" size="sm" [disabled]="!draftValid()" (click)="apply()">{{
        'ui.range.apply' | t
      }}</app-button>
    </div>
  </div>
</app-side-sheet>
