<!-- A list column has no breadcrumbs: its page is the root of the area. Below the bar of a
     one-view page the back arrow of the bar replaces them, and the bar shows the title:
     the header keeps it for screen readers only. -->
@if (!pane() && !underBar()) {
  <app-breadcrumbs />
}

<div class="ph__bar">
  <div class="ph__text">
    <div class="ph__heading">
      @if (titleTag() === 'p') {
        <p class="ph__title" [class.sr-only]="docked()" [attr.id]="titleId()">{{ title() }}</p>
      } @else {
        <h1 class="ph__title" [class.sr-only]="docked()" [attr.id]="titleId()">{{ title() }}</h1>
      }
      @if (meta()) {
        <span class="ph__meta">{{ meta() }}</span>
      }
      <ng-content select="[heading]" />
    </div>
    @if (subtitle()) {
      <p class="ph__subtitle">{{ subtitle() }}</p>
    }
  </div>
  @if (!docked()) {
    <div class="ph__actions"><ng-container *ngTemplateOutlet="actions" /></div>
  }
</div>
<!-- The actions render here, or in the bar of a one-view page while it shows. -->
<ng-template #actions><ng-content select="[actions]" /></ng-template>
