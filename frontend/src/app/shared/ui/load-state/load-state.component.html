@switch (state()) {
  @case ('loading') {
    @if (loadingTpl(); as tpl) {
      <ng-container [ngTemplateOutlet]="tpl" />
    } @else {
      <app-skeleton variant="lines" [count]="lines()" [label]="'common.loading' | t" />
    }
  }
  @case ('forbidden') {
    @if (forbiddenText(); as text) {
      <app-note kind="warn" icon="lock" role="alert">{{ text }}</app-note>
    }
  }
  @case ('error') {
    <app-load-error [message]="errorText()" (retry)="retry.emit()" />
    @if (keepContent()) {
      @if (content(); as tpl) {
        <ng-container [ngTemplateOutlet]="tpl" />
      }
    }
  }
  @default {
    @if (content(); as tpl) {
      <ng-container [ngTemplateOutlet]="tpl" />
    }
  }
}
