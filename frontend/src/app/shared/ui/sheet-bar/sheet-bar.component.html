@if (slotTitle()) {
  <div class="sheet-bar__title"><ng-content select="[appSheetBarTitle]" /></div>
} @else if (slotKicker()) {
  <div class="sheet-bar__kicker sheet-bar__kicker--slot"><ng-content select="[appSheetBarKicker]" /></div>
} @else if (kickerId(); as id) {
  <h2 class="sheet-bar__kicker ell" [id]="id" [title]="kicker() ?? ''">{{ kicker() }}</h2>
} @else {
  <span class="sheet-bar__kicker ell" [title]="kicker() ?? ''">{{ kicker() }}</span>
}
<div class="sheet-bar__actions"><ng-content /></div>
