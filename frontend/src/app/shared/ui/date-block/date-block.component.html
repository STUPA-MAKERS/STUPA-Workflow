@if (valid()) {
  <time class="db" [attr.datetime]="iso()">
    <span class="db__day" aria-hidden="true">{{ day() }}</span>
    <span class="db__month" aria-hidden="true">{{ month() }}</span>
    <span class="sr-only">{{ full() }}</span>
  </time>
} @else {
  <span class="db db--none" aria-hidden="true"><span class="db__day">–</span></span>
}
