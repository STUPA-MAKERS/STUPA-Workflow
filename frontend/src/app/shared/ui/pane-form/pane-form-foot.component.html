@if (deletable()) {
  <app-button variant="danger" [iconOnly]="compact()" [ariaLabel]="'action.delete' | t" (click)="removed.emit()">
    <span class="pff__btn"
      ><app-icon name="trash" />@if (!compact()) { {{ 'action.delete' | t }} }</span
    >
  </app-button>
}
<div class="pff__end">
  <app-button variant="text" (click)="cancelled.emit()">{{ 'action.cancel' | t }}</app-button>
  <ng-content />
</div>
