<app-icon class="pfh__icon" [name]="icon()" [size]="18" />
<p class="pfh__text ell">
  <strong class="pfh__title" role="heading" aria-level="2" [id]="headingId()">{{ heading() }}</strong>
  @if (subtitle()) {
    <span class="pfh__subtitle">{{ subtitle() }}</span>
  }
</p>
@if (!docked()) {
  <app-button-group>
    <app-button variant="text" (click)="closed.emit()">{{ 'action.cancel' | t }}</app-button>
  </app-button-group>
}
