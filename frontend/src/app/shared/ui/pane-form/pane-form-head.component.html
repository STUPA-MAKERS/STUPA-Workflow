<div class="pfh__titles">
  <h2 class="sheet-title pfh__title" [id]="headingId()">{{ heading() }}</h2>
  @if (subtitle()) {
    <p class="sheet-line pfh__subtitle">{{ subtitle() }}</p>
  }
</div>
@if (!docked()) {
  <app-button variant="text" [iconOnly]="true" [ariaLabel]="'action.close' | t" (click)="closed.emit()">
    <app-icon name="x" />
  </app-button>
}
