<app-dialog
  [open]="true"
  [heading]="'markdown.image.alt.title' | t"
  [subtitle]="fileName()"
  [closeLabel]="'action.close' | t"
  (closed)="cancel()"
  [actions]="[
    { key: 'cancel', label: ('action.cancel' | t) },
    { key: 'confirm', label: ('markdown.image.alt.confirm' | t), kind: 'main' },
  ]"
  (action)="$event.key === 'cancel' ? cancel() : $event.key === 'confirm' ? confirm() : null"
>
  <ng-template dialogBody>
    <form class="iad" (submit)="$event.preventDefault(); confirm()">
      <app-input
        name="alt"
        [label]="'markdown.image.alt.label' | t"
        [required]="!decorative()"
        [disabled]="decorative()"
        [error]="tried() && !valid() ? ('markdown.image.alt.required' | t) : ''"
        [ngModel]="decorative() ? '' : text()"
        (ngModelChange)="text.set($event)"
      />
      <app-checkbox
        name="decorative"
        [ngModel]="decorative()"
        (ngModelChange)="decorative.set($event)"
        >{{ 'markdown.image.alt.decorative' | t }}</app-checkbox
      >
    </form>
  </ng-template>
</app-dialog>
