<a
  class="beamer__exit"
  [class.beamer__exit--shown]="controlsVisible()"
  [routerLink]="backLink"
  (click)="leaveFullscreen()"
>
  <app-icon name="x" [size]="18" />
  {{ 'beamer.exit' | t }}
</a>

<app-meeting-beamer
  [meetingTitle]="meeting()?.title ?? null"
  [topLine]="topLine()"
  [vote]="vote()"
  [logoSrc]="logoSrc()"
  [join]="join()"
  [presence]="presence()"
/>
