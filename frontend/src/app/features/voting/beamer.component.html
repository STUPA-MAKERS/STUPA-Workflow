<!-- The route has no chrome, so this is the only way back without the browser.
     It stays invisible on the projector until a pointer or the keyboard reaches it. -->
<a class="beamer__exit" [routerLink]="backLink">{{ 'beamer.exit' | t }}</a>

<app-meeting-beamer
  [meetingTitle]="meeting()?.title ?? null"
  [topLine]="topLine()"
  [vote]="vote()"
  [logoSrc]="logoSrc()"
/>
