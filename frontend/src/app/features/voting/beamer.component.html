<!-- The route has no chrome, so this is the only way back without the browser (Escape
     also leaves). It shows when the pointer moves or the keyboard reaches it, and hides
     again when the pointer rests, so the projector shows no control. -->
<a
  class="beamer__exit"
  [class.beamer__exit--shown]="controlsVisible()"
  [routerLink]="backLink"
  (click)="leaveFullscreen()"
>
  <app-icon name="x" [size]="18" />
  {{ 'beamer.exit' | t }}
</a>

<app-meeting-beamer
  [meetingTitle]="meeting()?.title ?? null"
  [topLine]="topLine()"
  [vote]="vote()"
  [logoSrc]="logoSrc()"
  [join]="join()"
  [presence]="presence()"
/>
