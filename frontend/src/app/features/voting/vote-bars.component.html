@if (status(); as s) {
  <p class="bars__status">
    <app-status-text class="bars__result" [kind]="s.kind">{{ s.key | t }}</app-status-text>
    @if (failedReason() === 'quorum') {
      <span class="bars__reason">{{ 'vote.failedQuorum' | t }}</span>
    }
  </p>
}
<ul class="bars" [attr.aria-label]="'voting.bars.label' | t: { cast: cast() }">
  @for (row of rows(); track row.option) {
    <li class="bars__row">
      <div class="bars__line">
        <span class="bars__label">{{ row.label }}</span>
        <span class="bars__count mono">{{ row.count }}</span>
        <span class="bars__pct mono">{{ row.pct }} %</span>
      </div>
      <app-seg-bar
        [size]="variant() === 'beamer' ? 'fat' : 'normal'"
        [segments]="[{ value: row.count, tone: row.tone }]"
        [total]="cast()"
        [label]="rowLabel(row)"
      />
    </li>
  }
</ul>
