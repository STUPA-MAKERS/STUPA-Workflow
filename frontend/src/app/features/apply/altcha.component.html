<div class="altcha" [attr.data-state]="state()">
  <button
    type="button"
    class="altcha__btn"
    [disabled]="state() === 'verifying' || state() === 'solved'"
    [attr.aria-describedby]="noteId"
    (click)="solve()"
  >
    <span class="altcha__box" aria-hidden="true">
      @switch (state()) {
        @case ('solved') {
          <app-icon name="check" [size]="14" [strokeWidth]="2.6" />
        }
        @case ('verifying') {
          <span class="altcha__spinner"></span>
        }
      }
    </span>
    <span class="altcha__label">
      @switch (state()) {
        @case ('idle') {
          {{ 'altcha.idle' | t }}
        }
        @case ('verifying') {
          {{ 'altcha.verifying' | t }}
        }
        @case ('solved') {
          {{ 'altcha.solved' | t }}
        }
        @case ('error') {
          {{ 'altcha.error' | t }}
        }
      }
    </span>
    <span class="altcha__brand" aria-hidden="true">ALTCHA</span>
  </button>
  <p [id]="noteId" class="altcha__note" [class.altcha__note--error]="state() === 'error'" role="status">
    @switch (state()) {
      @case ('solved') {
        {{ 'altcha.noteSolved' | t }}
      }
      @case ('error') {
        {{ 'altcha.noteError' | t }}
      }
      @default {
        {{ 'altcha.note' | t }}
      }
    }
  </p>
</div>
