@if (hasAction()) {
  @if (canFinalize() || needsRight()) {
    <app-button
      variant="fill"
      [loading]="finalizing()"
      [disabled]="!canFinalize()"
      [title]="
        (canFinalize() ? 'meetings.protocol.finalize' : 'meetings.protocolBar.needsRight') | t
      "
      (click)="finalize.emit()"
    >
      <app-icon name="send" />
      {{ 'meetings.protocol.finalize' | t }}
    </app-button>
  } @else if (finalPdf(); as pdf) {
    <a
      appButton="tonal"
      [href]="pdf.url"
      target="_blank"
      rel="noopener"
      (click)="openPdf($event, pdf.url, pdf.label)"
    >
      <app-icon name="file" />
      {{ pdf.label | t }}
    </a>
  }
}

<app-confirm-dialog
  [open]="confirmDraft()"
  [title]="'meetings.draftMail.title' | t"
  [body]="draftBody()"
  [confirmLabel]="'meetings.draftMail.confirm' | t"
  [danger]="false"
  (confirm)="sendDraft()"
  (cancel)="confirmDraft.set(false)"
/>

<app-confirm-dialog
  [open]="confirmUnapprove()"
  [title]="'meetings.approval.removeTitle' | t"
  [confirmLabel]="'action.remove' | t"
  (confirm)="unapprove()"
  (cancel)="confirmUnapprove.set(false)"
/>

<app-confirm-dialog
  [open]="confirmReopen()"
  [title]="'meetings.reopen.title' | t"
  [body]="'meetings.reopen.body' | t"
  [confirmLabel]="'meetings.reopen.confirm' | t"
  [danger]="false"
  (confirm)="reopen()"
  (cancel)="confirmReopen.set(false)"
/>

@if (approvalOpen()) {
  <app-protocol-approval-dialog
    [open]="true"
    [meeting]="meeting()"
    [saving]="approvalSaving()"
    (closed)="approvalOpen.set(false)"
    (picked)="approve($event)"
  />
}
