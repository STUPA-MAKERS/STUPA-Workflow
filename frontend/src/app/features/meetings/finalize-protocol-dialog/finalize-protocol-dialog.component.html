<app-dialog
  [open]="open()"
  [heading]="'meetings.finalizeDialog.title' | t"
  [subtitle]="meetingTitle()"
  [closeLabel]="'action.close' | t"
  (closed)="cancel()"
  [actions]="[
    { key: 'cancel', label: ('action.cancel' | t) },
    { key: 'confirm', label: ('meetings.protocol.finalize' | t), kind: 'main', busy: finalizing() },
  ]"
  (action)="$event.key === 'cancel' ? cancel() : $event.key === 'confirm' ? confirm() : null"
>
  <ng-template dialogBody>
    <div class="fpd">
      <p class="fpd__text">{{ 'meetings.finalizeDialog.body' | t }}</p>
      @if (publicGremium()) {
        <app-note icon="globe">{{ 'meetings.protocol.publicNotice' | t }}</app-note>
        <app-switch [checked]="withheld()" (checkedChange)="withheld.set($event)">{{
          'meetings.finalizeDialog.withheld' | t
        }}</app-switch>
      }
    </div>
  </ng-template>
</app-dialog>
