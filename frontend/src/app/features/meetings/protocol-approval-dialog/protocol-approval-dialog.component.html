<app-dialog
  [open]="open()"
  [heading]="'meetings.approval.title' | t"
  [closeLabel]="'action.close' | t"
  (closed)="cancel()"
  [actions]="[
    { key: 'cancel', label: ('action.cancel' | t) },
    {
      key: 'submit',
      label: ('meetings.approval.submit' | t),
      kind: 'main',
      disabled: !choice(),
      busy: saving(),
    },
  ]"
  (action)="$event.key === 'cancel' ? cancel() : $event.key === 'submit' ? submit() : null"
>
  <ng-template dialogBody>
    <form (submit)="$event.preventDefault(); submit()">
      <app-load-state
        [state]="state()"
        [lines]="1"
        [errorText]="'gremien.meetings.error' | t"
        (retry)="load()"
      >
        <ng-template #content>
          @if (none()) {
            <app-empty-state
              icon="users"
              shape="choice"
              rows="2"
              [heading]="'meetings.approval.none' | t"
            />
          } @else {
            <app-select
              name="approvedBy"
              [id]="'pad-meeting'"
              [label]="'meetings.approval.meeting' | t"
              [options]="options()"
              [required]="true"
              [ngModel]="choice()"
              (ngModelChange)="choice.set($event)"
            />
          }
        </ng-template>
      </app-load-state>
      <button type="submit" hidden></button>
    </form>
  </ng-template>
</app-dialog>
