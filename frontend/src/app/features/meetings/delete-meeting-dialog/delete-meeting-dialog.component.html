<app-dialog
  [open]="meeting() !== null"
  [title]="'meetings.delete.title' | t"
  [closeLabel]="'action.cancel' | t"
  (closed)="cancel()"
>
  <p class="dmd__body">{{ bodyKey() | t: { name: meeting()?.title ?? '' } }}</p>
  <app-button dialog-footer variant="text" (click)="cancel()">{{ 'action.cancel' | t }}</app-button>
  <app-button dialog-footer variant="danger" [loading]="deleting()" (click)="confirm()">
    <app-icon name="trash" [size]="16" />
    {{ 'meetings.delete.confirm' | t }}
  </app-button>
</app-dialog>
