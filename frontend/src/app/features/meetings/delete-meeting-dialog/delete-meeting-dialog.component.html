<app-confirm-dialog
  [open]="meeting() !== null"
  [title]="'meetings.delete.dialogTitle' | t"
  [body]="bodyKey() | t: { name: meeting()?.title ?? '' }"
  [busy]="deleting()"
  (confirm)="confirm()"
  (cancel)="cancel()"
>
  @if (votesText(); as votes) {
    <p class="dmd__votes" role="status">{{ votes }}</p>
  }
</app-confirm-dialog>
