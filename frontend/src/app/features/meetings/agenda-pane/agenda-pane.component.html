<app-agenda-pane-view
  [meeting]="meeting()"
  [agenda]="agenda()"
  [selectedId]="selectedId()"
  [locked]="locked()"
  [savingAgenda]="savingAgenda()"
  [renamingTopId]="renamingTopId()"
  [(renameDraft)]="renameDraft"
  [inSheet]="inSheet()"
  [canTick]="canTick()"
  [canTodo]="canTodo()"
  (pick)="pick.emit($event)"
  (add)="add.emit()"
  (startRename)="startRename.emit($event)"
  (cancelRename)="cancelRename.emit()"
  (renameTop)="renameTop.emit($event)"
  (setNonPublic)="setNonPublic.emit($event)"
  (setDone)="setDone.emit($event)"
  (setDuration)="setDuration.emit($event)"
  (move)="move.emit($event)"
  (remove)="remove.emit($event)"
  (todoNew)="openTodo($event)"
  (todoLink)="openLink($event)"
/>

@if (todoOpen()) {
  <app-todo-new-dialog
    appBodyPortal
    [(open)]="todoOpen"
    [gremiumId]="meeting().gremiumId"
    [initialLinks]="todoLinks()"
    (created)="onTodoCreated($event)"
  />
}
<app-todo-link-picker [(open)]="linkOpen" [exclude]="linkEnd()" (picked)="linkPicked($event)" />
