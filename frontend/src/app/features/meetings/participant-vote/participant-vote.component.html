@if (state.vote(); as v) {
  <app-vote-panel-view
    [meetingLink]="meetingLink"
    [applicationLink]="applicationLink"
    [layout]="layout()"
    [context]="context()"
    [vote]="v"
    [own]="state.own()"
    [proxyName]="state.proxyName()"
    [proxyCount]="state.proxyCount()"
    [proxyCast]="state.proxyCast()"
    [caster]="state.caster"
    [notice]="state.notice()"
    (castDone)="state.onCastDone()"
    (castFailed)="state.onCastFailed($event)"
    (changed)="state.onElectionChanged()"
  />
}
