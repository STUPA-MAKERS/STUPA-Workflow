<app-attendance-sheet-view
  [(open)]="open"
  [protocolLocked]="protocolLocked()"
  [meeting]="meeting()"
  [attendance]="attendance()"
  [saving]="saving()"
  [viewers]="viewers()"
  [conflictId]="conflictId()"
  [guestCount]="guestCount()"
  [guestsHead]="guestsHead"
  [guestList]="guestList"
  [ownDelegation]="ownDelegation"
  (statusChange)="statusChange.emit($event)"
  (statusReset)="statusReset.emit($event)"
  (conflictResolved)="conflictResolved.emit($event)"
  (substitute)="substituteFor.set($event)"
  (ownReload)="reloadOwn()"
/>

<ng-template #guestsHead let-m>
  @if (guests?.joinLink(); as link) {
    <app-join-link variant="sheet" [link]="link" (showLarge)="showQr.emit()" />
  }
  <app-guest-requests [meeting]="m" />
</ng-template>

<ng-template #guestList let-m let-query="query">
  <app-guest-list [meeting]="m" [query]="query" />
</ng-template>

<ng-template #ownDelegation let-m>
  <app-meeting-delegation-card
    class="as__own"
    [meetingId]="m.id"
    (changed)="onOwnChange($event)"
  />
</ng-template>

<app-lead-substitute-dialog
  [meetingId]="meeting().id"
  [member]="substituteFor()"
  (closed)="substituteFor.set(null)"
  (created)="onSubstituted()"
/>
