<app-dialog
  [open]="meetingId() !== null"
  [heading]="'meetings.lateExcuse.title' | t"
  [closeLabel]="'action.close' | t"
  (closed)="cancel()"
  [actions]="[
    { key: 'cancel', label: ('action.cancel' | t) },
    {
      key: 'save',
      label: ('meetings.lateExcuse.submit' | t),
      kind: 'main',
      disabled: !valid(),
      busy: saving(),
    },
  ]"
  (action)="$event.key === 'cancel' ? cancel() : $event.key === 'save' ? save() : null"
>
  <ng-template dialogBody>
    <form (submit)="$event.preventDefault(); save()">
      <app-textarea [label]="'meetings.lateExcuse.note' | t" [invalid]="tooLong()">
        <textarea
          id="led-note"
          name="note"
          rows="3"
          required
          [attr.maxlength]="max"
          [ngModel]="note()"
          (ngModelChange)="note.set($event)"
        ></textarea>
      </app-textarea>
      <button type="submit" hidden></button>
    </form>
  </ng-template>
</app-dialog>
