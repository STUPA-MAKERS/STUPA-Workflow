<app-dialog
  [open]="meetingId() !== null"
  [title]="'meetings.lateExcuse.title' | t"
  [closeLabel]="'action.close' | t"
  (closed)="cancel()"
>
  <form (submit)="$event.preventDefault(); save()">
    <app-textarea [label]="'meetings.lateExcuse.note' | t" [invalid]="tooLong()">
      <textarea
        id="led-note"
        name="note"
        rows="3"
        required
        [attr.maxlength]="max"
        [ngModel]="note()"
        (ngModelChange)="note.set($event)"
      ></textarea>
    </app-textarea>
    <button type="submit" hidden></button>
  </form>
  <app-button dialog-footer variant="text" (click)="cancel()">{{ 'action.cancel' | t }}</app-button>
  <app-button dialog-footer variant="fill" [loading]="saving()" [disabled]="!valid()" (click)="save()">
    {{ 'meetings.lateExcuse.submit' | t }}
  </app-button>
</app-dialog>
