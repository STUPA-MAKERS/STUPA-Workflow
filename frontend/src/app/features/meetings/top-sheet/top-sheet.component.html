<app-top-sheet-view
  [meeting]="meeting()"
  [protocol]="protocol()"
  [top]="top()"
  [topIndex]="topIndex()"
  [editable]="editable()"
  [canEdit]="canEdit()"
  [saveState]="saveState()"
  [revision]="revision()"
  [follow]="follow()"
  [linked]="linked()"
  [barControls]="barControls()"
  [canRename]="canRename()"
  [renamingTopId]="renamingTopId()"
  [(renameDraft)]="renameDraft"
  [(mode)]="mode"
  [voteInfo]="voteInfo()"
  [keepers]="keepers()"
  [linkedList]="linkedTpl"
  (bodyChange)="bodyChange.emit($event)"
  (startRename)="startRename.emit($event)"
  (cancelRename)="cancelRename.emit()"
  (renameTop)="renameTop.emit($event)"
  (doneChange)="doneChange.emit($event)"
  (documentOpen)="openDocument($event)"
/>

@if (shownDocument()) {
  <app-document-viewer [(doc)]="shownDocument" />
}

<ng-template #linkedTpl let-t let-follow="follow">
  @if (!follow) {
    <app-todo-linked-list class="ts__todos" kind="agenda_item" headingId="ts-todos" [showTitle]="false" [targetId]="t.id" [lead]="applicationLead()" />
  } @else if (applicationLead(); as lead) {
    <app-todo-linked-list class="ts__todos" kind="agenda_item" headingId="ts-todos" [showTitle]="false" [targetId]="t.id" [items]="[]" [lead]="lead" />
  }
</ng-template>
