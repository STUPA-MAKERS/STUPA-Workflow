<app-dialog
  [open]="open()"
  [heading]="'todos.transfer.title' | t"
  [closeLabel]="'action.close' | t"
  (closed)="cancel()"
  [actions]="!none() && !unloadable() ? [{ key: 'cancel', label: ('action.cancel' | t) }, {
      key: 'confirm',
      label: ('todos.transfer.confirm' | t),
      kind: 'main',
      disabled: !canConfirm(),
      busy: busy(),
    }] : [{ key: 'cancel', label: ('action.cancel' | t) }]"
  (action)="$event.key === 'cancel' ? cancel() : $event.key === 'confirm' ? confirm() : null"
>
  <ng-template dialogBody>
    @if (none()) {
      <app-empty-state
        icon="kanban"
        shape="choice"
        rows="3"
        [heading]="'todos.transfer.none' | t"
      />
    } @else if (unloadable()) {
      <app-error-text>{{ 'todos.error.transfer' | t }}</app-error-text>
    } @else {
      <form class="tt" (submit)="$event.preventDefault(); confirm()">
        <app-select
          name="board"
          [label]="'todos.transfer.board' | t"
          [options]="boardOptions()"
          [ngModel]="selectedBoard()"
          (ngModelChange)="setBoard($event)"
        />
        <app-select
          name="column"
          [label]="'todos.transfer.column' | t"
          [options]="columnOptions()"
          [ngModel]="column()"
          (ngModelChange)="column.set($event)"
        />
        @if (failed()) {
          <app-error-text>{{ 'todos.error.transfer' | t }}</app-error-text>
        }
      </form>
    }

  </ng-template>
</app-dialog>
