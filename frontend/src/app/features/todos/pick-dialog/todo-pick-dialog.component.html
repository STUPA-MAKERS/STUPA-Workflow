<app-dialog
  [open]="open()"
  [heading]="heading()"
  [closeLabel]="'action.close' | t"
  size="md"
  body="tight"
  (closed)="cancel()"
  [actions]="[
    { key: 'cancel', label: ('action.cancel' | t) },
    {
      key: 'submit',
      label: submitLabel(),
      icon: submitIcon() ?? undefined,
      kind: 'main',
      disabled: !pick() || busy(),
    },
  ]"
  (action)="$event.key === 'cancel' ? cancel() : $event.key === 'submit' ? submit() : null"
>
  <ng-template dialogBody>
    <form class="pd" (submit)="$event.preventDefault(); submit()">
      <div class="pd__area">
        @if (searchLabel()) {
          <app-search-pill
            size="md"
            [placeholder]="searchLabel()"
            [value]="query()"
            (valueChange)="query.set($event)"
          />
        }
        <div class="pd__slot">
          @if (rows(); as list) {
            @if (list.length) {
              <div
                class="pd__list rowgroup rowgroup--bg3"
                appScrollFade="y"
                role="radiogroup"
                [attr.aria-label]="listLabel()"
              >
                @for (r of list; track r.id) {
                  @let on = pick() === r.id;
                  <label class="pd__row" [class.pd__row--on]="on" data-testid="pick-row">
                    <input
                      class="pd__radio"
                      type="radio"
                      name="todo-pick"
                      [value]="r.id"
                      [checked]="on"
                      (change)="pick.set(r.id)"
                    />
                    <span class="pd__text">
                      <span class="pd__title ell">{{ r.title }}</span>
                      @if (r.sub) {
                        <span class="pd__sub ell">{{ r.sub }}</span>
                      }
                    </span>
                    @if (on) {
                      <app-icon class="pd__check" name="check" [size]="18" />
                    }
                  </label>
                }
              </div>
            } @else {
              <app-empty-state icon="circleok" shape="choice" [heading]="emptyHeading()" />
            }
          } @else {
            <app-skeleton variant="rows" [count]="4" [label]="'common.loading' | t" />
          }
        </div>
      </div>
      <button type="submit" hidden></button>
    </form>
  </ng-template>
</app-dialog>
