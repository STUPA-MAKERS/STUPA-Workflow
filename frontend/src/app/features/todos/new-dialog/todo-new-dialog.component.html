<app-dialog
  [open]="open()"
  [heading]="heading() | t"
  [closeLabel]="'action.close' | t"
  size="md"
  (closed)="cancel()"
  [actions]="[
    { key: 'cancel', label: ('action.cancel' | t) },
    {
      key: 'save',
      label: ('todos.new.create' | t),
      kind: 'main',
      disabled: !canSave(),
      busy: saving(),
    },
  ]"
  (action)="$event.key === 'cancel' ? cancel() : $event.key === 'save' ? save() : null"
>
  <ng-template dialogBody>
    <form class="tn" (submit)="$event.preventDefault(); save()">
      <app-input
        name="title"
        [label]="'todos.new.cardTitle' | t"
        [required]="true"
        [error]="titleError()"
        [ngModel]="title()"
        (ngModelChange)="title.set($event)"
      />

      @if (noBoard()) {
        <app-error-text>{{ 'todos.new.noBoard' | t }}</app-error-text>
      } @else {
        <div class="tn__pair">
          <app-select
            name="board"
            [label]="'todos.new.board' | t"
            [options]="boardOptions()"
            [ngModel]="selectedBoard()"
            (ngModelChange)="setBoard($event)"
          />
          <app-select
            name="column"
            [label]="'todos.new.column' | t"
            [options]="columnOptions()"
            [ngModel]="column()"
            (ngModelChange)="column.set($event)"
          />
        </div>
        <div class="tn__pair">
          <app-select
            name="assignee"
            [label]="'todos.new.assignee' | t"
            [options]="memberOptions()"
            [ngModel]="assignee()"
            (ngModelChange)="assignee.set($event)"
          />
          <app-datepicker
            name="due"
            [label]="'todos.new.due' | t"
            [ngModel]="due()"
            (ngModelChange)="due.set($event ?? '')"
          />
        </div>
      }

      <div class="tn__links" role="group" aria-labelledby="tn-links">
        <span id="tn-links" class="tn__cap">{{ 'todos.new.linked' | t }}</span>
        @for (link of links(); track link.kind + link.targetId) {
          <app-chip
            class="tn__chip"
            [removable]="true"
            [removeLabel]="'todos.new.unlink' | t: { label: link.label }"
            (remove)="unlink(link)"
          >
            <app-icon [name]="icon(link.kind)" [size]="15" />
            <span class="tn__chipText">{{ link.label }}</span>
          </app-chip>
        }
        <div class="tn__add">
          <app-button-group>
            <app-button variant="text" size="sm" (click)="pickerOpen.set(!pickerOpen())">
              <app-icon name="link" />
              {{ 'todos.new.link' | t }}
            </app-button>
          </app-button-group>
        </div>
        <div class="tn__picker">
          <app-todo-link-picker
            [(open)]="pickerOpen"
            [linked]="linkedKeys()"
            (picked)="pickLink($event)"
          />
        </div>
      </div>

      @if (withDescription()) {
        <app-textarea class="tn__desc" [label]="'todos.new.description' | t" [grow]="true">
          <textarea
            id="tn-desc"
            name="description"
            rows="3"
            maxlength="20000"
            appMarkdownImageUpload
            [ngModel]="description()"
            (ngModelChange)="description.set($event)"
          ></textarea>
        </app-textarea>
      }
    </form>
  </ng-template>
</app-dialog>
