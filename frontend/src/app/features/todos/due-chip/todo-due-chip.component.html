<span class="dc">
  <button
    type="button"
    class="chip dc__chip"
    [disabled]="disabled()"
    [attr.aria-label]="(text() ? 'todos.due.change' : 'todos.due.set') | t: { date: text() ?? '' }"
    (click)="pick()"
  >
    <app-icon name="cal" [size]="15" />
    <span>{{ text() ?? ('todos.due.none' | t) }}</span>
    <app-icon class="dc__chev" name="down" [size]="15" />
  </button>
  @if (value() && !disabled()) {
    <button
      type="button"
      class="dc__x"
      [attr.aria-label]="'todos.due.remove' | t"
      [title]="'todos.due.remove' | t"
      (click)="changed.emit(null)"
    >
      <app-icon name="x" [size]="14" />
    </button>
  }
  <input
    #native
    class="dc__native"
    type="date"
    tabindex="-1"
    aria-hidden="true"
    (change)="onNative($any($event.target).value)"
  />
</span>
