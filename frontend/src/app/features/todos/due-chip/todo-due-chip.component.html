<span class="dc">
  <button
    type="button"
    class="chip dc__chip"
    [disabled]="disabled()"
    (click)="pick()"
  >
    <!-- The action is hidden text before the visible date, not an aria-label: the name must
         hold the visible text (WCAG 2.5.3). -->
    <span class="sr-only">{{ (text() ? 'todos.due.change' : 'todos.due.set') | t: { date: '' } }}</span>
    <app-icon name="cal" [size]="15" />
    <span>{{ text() ?? ('todos.due.none' | t) }}</span>
    @if (!disabled()) {
      <app-icon class="dc__chev" name="down" [size]="15" />
    }
  </button>
  <input
    #native
    class="dc__native"
    type="date"
    tabindex="-1"
    aria-hidden="true"
    (change)="onNative($any($event.target).value)"
  />
</span>
