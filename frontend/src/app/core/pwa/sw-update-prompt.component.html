<div class="sw-prompt-region" aria-live="polite">
  @if (sw.updateReady()) {
    <div class="sw-prompt" role="status">
      <span class="sw-prompt__msg">{{ 'pwa.updateReady' | t }}</span>
      <app-button variant="fill" size="sm" (click)="sw.reload()">{{ 'pwa.reload' | t }}</app-button>
    </div>
  }
</div>
